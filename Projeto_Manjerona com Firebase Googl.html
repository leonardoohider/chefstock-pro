    <script>
        // --- CONFIGURAÇÃO DO FIREBASE ---
        const firebaseConfig = {
            apiKey: "AIzaSyBsm4VWu31m3HJ1dzbhdFWnh7gSsDXID54",
            authDomain: "chefstock-pro-22b78.firebaseapp.com",
            projectId: "chefstock-pro-22b78",
            storageBucket: "chefstock-pro-22b78.firebasestorage.app",
            messagingSenderId: "1069505098415",
            appId: "1:1069505098415:web:1b96abc89a11c2e7d25a5a"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        const SEED_CATEGORIES = [
            { id: 'c1', name: 'Belave', color: '#ef4444', order: 1 },
            { id: 'c2', name: 'Casa', color: '#f97316', order: 2 },
            { id: 'c3', name: 'Lidl', color: '#eab308', order: 3 },
            { id: 'c4', name: 'Recheio', color: '#22c55e', order: 4 },
            { id: 'c5', name: 'Macro', color: '#06b6d4', order: 5 },
            { id: 'c6', name: 'Pingo Doce / Continente', color: '#3b82f6', order: 6 },
            { id: 'c7', name: 'Capuchos', color: '#a855f7', order: 7 },
            { id: 'c8', name: 'Aromas', color: '#ec4899', order: 8 }
        ];

        const SEED_MASTER = [
            { group: 'Legumes & Verduras', items: ['Tomate', 'Tomate Cherry', 'Alface', 'Rúcula', 'Espinafres', 'Grelos', 'Brócolos', 'Feijão Verde', 'Cenoura', 'Curgete', 'Cebola', 'Cebola Roxa', 'Alho', 'Pimento', 'Pimentos Padrón', 'Jalapeño', 'Paris'] },
            { group: 'Fruta', items: ['Ananás', 'Abacate'] },
            { group: 'Carnes & Peixe', items: ['Ovo', 'Frango', 'Carne Picada', 'Atum', 'Bacon', 'Fiambre', 'Presunto', 'Alheira', 'Chouriço', 'Salsicha', 'Pepperoni', 'Calabresa', 'Delícias do Mar', 'Anchovas'] },
            { group: 'Laticínios & Queijos', items: ['Leite', 'Natas', 'Creme Azedo', 'Manteiga', 'Margarina', 'Ricotta', 'Mozzarella', 'Moz. Fresca', 'Parmesão', 'Emmental', 'Queijo de Cabra', 'Queijo de Ovelha', 'Gorgonzola'] },
            { group: 'Massas & Cereais', items: ['Tortilhas', 'Massa', 'Massa s/ glúten', 'Cuscuz', 'Farinha', 'Fermento', 'Torradas'] },
            { group: 'Conservas & Extras', items: ['Feijão', 'Milho', 'Azeitonas', 'Alcaparras', 'Frutos Secos', 'Mel'] },
            { group: 'Ervas & Temperos', items: ['Manjericão', 'Manjerona', 'Cebolinho', 'Alecrim', 'Louro', 'Salsa', 'Coentros', 'Sal'] },
            { group: 'Molhos', items: ['Molho Pesto', 'Molho de Alcaparras'] }
        ];

        let state = {
            categories: [],
            products: [], 
            history: {},  
            masterData: [],
            notas: [],
            emojis: [],
            yearResetPending: false
        };

        let undoStack = [];
        let redoStack = [];

        let uiState = {
            estoqueSubView: 'fornecedores',
            activeCatFilter: 'ALL',
            activeMasterGroup: 'ALL',
            searchQuery: '',
            collapsedCats: {}
        };

        // --- FUNÇÕES DE NORMALIZAÇÃO (SEM ACENTO) E SIMILARIDADE DE PALAVRAS ---
        function normalizeText(str) {
            return (str || '')
                .toString()
                .normalize('NFD')
                .replace(/[\u0300-\u036f]/g, '')
                .toLowerCase()
                .trim();
        }

        function editDistance(a, b) {
            if (a.length === 0) return b.length;
            if (b.length === 0) return a.length;
            const matrix = [];
            for (let i = 0; i <= b.length; i++) matrix[i] = [i];
            for (let j = 0; j <= a.length; j++) matrix[0][j] = j;
            for (let i = 1; i <= b.length; i++) {
                for (let j = 1; j <= a.length; j++) {
                    if (b.charAt(i - 1) === a.charAt(j - 1)) {
                        matrix[i][j] = matrix[i - 1][j - 1];
                    } else {
                        matrix[i][j] = Math.min(
                            matrix[i - 1][j - 1] + 1,
                            Math.min(matrix[i][j - 1] + 1, matrix[i - 1][j] + 1)
                        );
                    }
                }
            }
            return matrix[b.length][a.length];
        }

        function findSimilarMasterItems(rawQuery) {
            const q = normalizeText(rawQuery);
            if (!q) return [];

            const scored = [];
            state.masterData.forEach(item => {
                const normName = normalizeText(item.name);
                const words = normName.split(/\s+/);
                let score = 0;

                if (normName === q) {
                    score = 100; // Match exato (com ou sem acento)
                } else if (normName.startsWith(q)) {
                    score = 90;  // Começa com a palavra digitada
                } else if (words.some(w => w.startsWith(q))) {
                    score = 80;  // Alguma palavra começa com o texto
                } else if (normName.includes(q)) {
                    score = 70;  // Contém o trecho digitado
                } else if (q.length >= 3) {
                    // Verifica similaridade para erros de digitação / palavras semelhantes
                    const minWordDist = Math.min(...words.map(w => editDistance(q, w)), editDistance(q, normName));
                    const maxAllowed = q.length <= 4 ? 1 : 2;
                    if (minWordDist <= maxAllowed) {
                        score = 60 - (minWordDist * 10);
                    }
                }

                if (score > 0) {
                    scored.push({ item, score });
                }
            });

            scored.sort((a, b) => b.score - a.score || a.item.name.localeCompare(b.item.name));
            return scored.map(s => s.item);
        }

        function getMasterItemAllocation(itemName) {
            const allocatedProds = state.products.filter(p => p.name === itemName);
            const cats = allocatedProds.map(p => state.categories.find(c => c.id === p.categoryId)).filter(Boolean);
            const uniqueColors = [...new Set(cats.map(c => c.color))];
            if (uniqueColors.length === 0) return { isAllocated: false, colors: [] };
            return { isAllocated: true, colors: uniqueColors };
        }

        async function init() {
            await loadData();
            loadStacks();
            if (!state.categories || state.categories.length === 0) {
                state.categories = JSON.parse(JSON.stringify(SEED_CATEGORIES));
            }
            if (!state.masterData || state.masterData.length === 0) {
                let mId = 1;
                SEED_MASTER.forEach(g => {
                    g.items.forEach(itemName => {
                        state.masterData.push({ id: 'm' + mId++, group: g.group, name: itemName });
                    });
                });
            }
            if (!state.emojis || state.emojis.length === 0) {
                state.emojis = ['🍅','🧅','🥔','🥬','🥩','🍗','🐟','🥚','🧀','🧈','🥛','🍞','🧊','📦','✅','❌','⚠️','🚨','🚚'];
            }

            saveData();
            checkYearResetLogic();
            renderEstoque();
            renderEmojis();
            updateBadge();
        }

        function loadStacks() {
            try {
                let s = localStorage.getItem('chefstock_stacks');
                if(s) { let parsed = JSON.parse(s); undoStack = parsed.undo || []; redoStack = parsed.redo || []; }
            } catch(e){}
        }

        function saveStacks() {
            localStorage.setItem('chefstock_stacks', JSON.stringify({
                undo: undoStack.slice(-15),
                redo: redoStack.slice(-15)
            }));
        }

        function pushStateToUndo() {
            if (state.lastBackup) delete state.lastBackup; 
            undoStack.push(JSON.stringify(state));
            redoStack = []; 
            if (undoStack.length > 15) undoStack.shift();
            saveStacks();
        }

        function actionUndo() {
            if (undoStack.length === 0) return;
            showModal("Desfazer Ação", "<p class='text-zinc-700 text-sm'>Deseja voltar no tempo e <b>desfazer</b> a última alteração feita?</p>", "Sim, Desfazer", "bg-amber-500 text-zinc-950", () => {
                redoStack.push(JSON.stringify(state)); 
                state = JSON.parse(undoStack.pop());   
                saveStacks(); saveData(); 
                renderHistorico(); renderEstoque(); renderLista(); renderNotas(); renderEmojis();
            });
        }

        function actionRedo() {
            if (redoStack.length === 0) return;
            showModal("Refazer Ação", "<p class='text-zinc-700 text-sm'>Deseja avançar no tempo e <b>refazer</b> a ação que acabou de ser desfeita?</p>", "Sim, Refazer", "bg-emerald-500 text-zinc-950", () => {
                undoStack.push(JSON.stringify(state)); 
                state = JSON.parse(redoStack.pop());   
                saveStacks(); saveData(); 
                renderHistorico(); renderEstoque(); renderLista(); renderNotas(); renderEmojis();
            });
        }

        async function loadData() {
            try {
                const docRef = db.collection("sistema").doc("estoque_principal");
                const docSnap = await docRef.get();
                if (docSnap.exists) {
                    state = docSnap.data();
                    localStorage.setItem('chefstock_pro_v3_data', JSON.stringify(state));
                } else {
                    const stored = localStorage.getItem('chefstock_pro_v3_data');
                    if (stored) state = JSON.parse(stored);
                }
            } catch (e) {
                const stored = localStorage.getItem('chefstock_pro_v3_data');
                if (stored) state = JSON.parse(stored);
            }

            if (!state.history) state.history = {};
            if (!state.masterData) state.masterData = [];
            if (!state.categories) state.categories = [];
            if (!state.products) state.products = [];
            if (!state.notas) state.notas = [];
            if (!state.emojis) state.emojis = [];
            if (state.lastBackup !== undefined) delete state.lastBackup; 

            state.products.forEach(p => { 
                if (p.pending === undefined) p.pending = false; 
                if (p.selected === undefined) p.selected = false;
                if (p.received === undefined) p.received = p.qty; 
                if (p.type === undefined) p.type = 'Unidade';
            });
        }

        async function saveData() {
            localStorage.setItem('chefstock_pro_v3_data', JSON.stringify(state));
            updateBadge();
            try { await db.collection("sistema").doc("estoque_principal").set(JSON.parse(JSON.stringify(state))); } catch (e) {}
        }

        function updateBadge() {
            const listCount = state.products.filter(p => p.qty > 0 && !p.pending).length;
            const badge = document.getElementById('badge-lista');
            const headerCount = document.getElementById('header-active-count');
            if (headerCount) headerCount.innerText = listCount;
            if (listCount > 0) badge.classList.remove('hidden'); else badge.classList.add('hidden');
            badge.innerText = listCount;
        }

        function setEstoqueSubView(subView) {
            uiState.estoqueSubView = subView;
            const pF = document.getElementById('panel-fornecedores');
            const pC = document.getElementById('panel-catalogo');
            const bF = document.getElementById('subbtn-fornecedores');
            const bC = document.getElementById('subbtn-catalogo');

            if (subView === 'fornecedores') {
                pF.classList.remove('hidden'); pC.classList.add('hidden');
                bF.className = "flex-1 py-2 rounded-lg text-xs font-extrabold flex items-center justify-center gap-1.5 bg-zinc-950 text-white shadow-xs";
                bF.innerHTML = `<i class="fa-solid fa-layer-group text-emerald-400"></i> Fornecedores`;
                bC.className = "flex-1 py-2 rounded-lg text-xs font-extrabold flex items-center justify-center gap-1.5 text-zinc-600";

                pF.classList.add('hidden'); pC.classList.remove('hidden');

                bC.innerHTML = `<i class="fa-solid fa-database text-emerald-400"></i> Catálogo Base`;
                bF.className = "flex-1 py-2 rounded-lg text-xs font-extrabold flex items-center justify-center gap-1.5 text-zinc-600";

        function setCatFilter(catId) { uiState.activeCatFilter = catId; renderEstoque(); }
        function setMasterGroupFilter(gName) { uiState.activeMasterGroup = gName; renderMasterData(); }
        function toggleCatCollapse(catId) { uiState.collapsedCats[catId] = !uiState.collapsedCats[catId]; renderEstoque(); }
        
        function handleSearch(val) {
            uiState.searchQuery = val.trim();
            document.getElementById('btn-clear-search').classList.toggle('hidden', uiState.searchQuery.length === 0);
            renderEstoque();
        }
        function clearSearch() { document.getElementById('global-search').value = ''; handleSearch(''); }

        function closeModal() { document.getElementById('u-modal').classList.add('hidden'); }
        function showModal(title, bodyHtml, confirmText, confirmBgColor, onConfirm) {
            document.getElementById('um-title').innerHTML = title;
            document.getElementById('um-body').innerHTML = bodyHtml;
            document.getElementById('um-footer').innerHTML = `
                <button onclick="closeModal()" class="px-4 py-2 text-xs font-bold text-zinc-600 bg-zinc-100 hover:bg-zinc-200 rounded-xl transition">Cancelar</button>
                <button id="um-confirm" class="px-4 py-2 text-xs font-bold text-white rounded-xl transition ${confirmBgColor}">${confirmText}</button>
            `;
            document.getElementById('um-confirm').onclick = () => { if (onConfirm() !== false) closeModal(); };
            document.getElementById('u-modal').classList.remove('hidden');
        }

        function showDecisionModal(title, bodyHtml, btn1Text, btn1Bg, onBtn1, btn2Text, btn2Bg, onBtn2) {
            document.getElementById('um-title').innerHTML = title;
            document.getElementById('um-body').innerHTML = bodyHtml;
            document.getElementById('um-footer').innerHTML = `
                <button id="um-btn1" class="px-3 py-2.5 text-xs font-bold text-white rounded-xl transition shadow-xs flex-1 ${btn1Bg}">${btn1Text}</button>
                <button id="um-btn2" class="px-3 py-2.5 text-xs font-bold text-white rounded-xl transition shadow-xs flex-1 ${btn2Bg}">${btn2Text}</button>
            `;
            document.getElementById('um-btn1').onclick = () => { if (onBtn1() !== false) closeModal(); };
            document.getElementById('um-btn2').onclick = () => { if (onBtn2() !== false) closeModal(); };
            document.getElementById('u-modal').classList.remove('hidden');
        }

        function switchTab(tabId) {
            ['estoque', 'lista', 'historico', 'notas'].forEach(id => {
                document.getElementById(`tab-${id}`).classList.replace('text-white', 'text-zinc-400');
                document.getElementById(`nav-pill-${id}`).classList.remove('bg-emerald-500/20', 'text-emerald-400');
                document.getElementById(`view-${id}`).classList.add('hidden');
            });

            document.getElementById(`tab-${tabId}`).classList.replace('text-zinc-400', 'text-white');
            document.getElementById(`nav-pill-${tabId}`).classList.add('bg-emerald-500/20', 'text-emerald-400');
            document.getElementById(`view-${tabId}`).classList.remove('hidden');

            if (tabId === 'estoque') renderEstoque();
            if (tabId === 'lista') renderLista();
            if (tabId === 'historico') renderHistorico();
            if (tabId === 'notas') { renderNotas(); renderEmojis(); }
        }

        function hexToRgba(hex, alpha) {
            const r = parseInt(hex.slice(1, 3), 16) || 0, g = parseInt(hex.slice(3, 5), 16) || 0, b = parseInt(hex.slice(5, 7), 16) || 0;
            return `rgba(${r}, ${g}, ${b}, ${alpha})`;
        }

        function handleDragStart(e, type, idOrIndex) { e.dataTransfer.setData('text/plain', type + '|' + idOrIndex); setTimeout(() => e.target.classList.add('dragging'), 0); }
        function handleDragOver(e) { e.preventDefault(); e.currentTarget.classList.add('drag-target-hover'); }
        function handleDragLeave(e) { e.currentTarget.classList.remove('drag-target-hover'); }
        function handleDragEnd(e) { e.target.classList.remove('dragging'); document.querySelectorAll('.cat-container').forEach(el => el.classList.remove('drag-target-hover')); }
        function handleDrop(e, targetCatId) {
            e.preventDefault(); e.currentTarget.classList.remove('drag-target-hover');
            const dataStr = e.dataTransfer.getData('text/plain'); if(!dataStr) return;
            const [type, payload] = dataStr.split('|');

            if (type === 'master') {
                const item = state.masterData.find(m => m.id === payload);
                if (item) {
                    const exists = state.products.find(p => p.name === item.name && p.categoryId === targetCatId);
                    if (!exists) {
                        pushStateToUndo();
                        state.products.push({ id: 'p' + Date.now(), categoryId: targetCatId, name: item.name, qty: 0, received: 0, type: 'Unidade', urgent: false, pending: false, selected: false });
                    }
                    saveData(); renderEstoque();
                }
            } else if (type === 'cat') {
                const dragIndex = parseInt(payload); const targetIndex = state.categories.findIndex(c => c.id === targetCatId);
                if (dragIndex !== targetIndex && targetIndex !== -1) {
                    pushStateToUndo();
                    const catArr = state.categories.sort((a,b) => a.order - b.order);
                    const movedItem = catArr.splice(dragIndex, 1)[0];
                    catArr.splice(targetIndex, 0, movedItem);
                    catArr.forEach((c, i) => c.order = i); state.categories = catArr;
                    saveData(); renderEstoque();
                }
            }
        }

        // --- ADIÇÃO POR DIGITAÇÃO INTELIGENTE DENTRO DO FORNECEDOR ---
        function handleCatQuickInput(catId, rawValue) {
            const box = document.getElementById(`cat-sugg-${catId}`);
            if (!box) return;

            const trimmed = rawValue.trim();
            if (!trimmed) {
                box.classList.add('hidden');
                box.innerHTML = '';
                return;
            }

            const matches = findSimilarMasterItems(trimmed).slice(0, 6);
            const exactMatch = state.masterData.find(m => normalizeText(m.name) === normalizeText(trimmed));

            let html = '';
            if (matches.length > 0) {
                matches.forEach(m => {
                    const alreadyInThisCat = state.products.some(p => p.categoryId === catId && normalizeText(p.name) === normalizeText(m.name));
                    html += `
                        <button type="button" onclick="selectMasterSuggestionForCat('${catId}', '${m.id}')" class="w-full text-left px-3 py-2 text-xs hover:bg-emerald-50 flex items-center justify-between border-b border-zinc-100 last:border-0 transition">
                            <div>
                                <span class="font-bold text-zinc-900">${m.name}</span>
                                <span class="text-[10px] text-zinc-400 ml-1.5 font-semibold">(${m.group})</span>
                            </div>
                            ${alreadyInThisCat 
                                ? `<span class="text-[10px] font-extrabold text-amber-600 bg-amber-50 px-2 py-0.5 rounded-full">Já na lista</span>` 
                                : `<span class="text-[10px] font-extrabold text-emerald-600 bg-emerald-50 px-2 py-0.5 rounded-full">+ Puxar</span>`
                            }
                        </button>
                    `;
                });
            }

            if (!exactMatch) {
                html += `
                    <button type="button" onclick="submitCatQuickAdd('${catId}')" class="w-full text-left px-3 py-2.5 text-xs bg-zinc-950 text-white hover:bg-zinc-800 flex items-center justify-between transition">
                        <span class="truncate pr-2"><i class="fa-solid fa-plus text-emerald-400 mr-1.5"></i>Cadastrar <b>"${trimmed}"</b> no Catálogo...</span>
                        <span class="text-[10px] bg-emerald-500 text-zinc-950 font-extrabold px-2 py-0.5 rounded-full shrink-0">Novo</span>
                    </button>
                `;
            }

            box.innerHTML = html;
            box.classList.remove('hidden');
        }

        function selectMasterSuggestionForCat(catId, masterId) {
            const masterItem = state.masterData.find(m => m.id === masterId);
            if (!masterItem) return;
            allocateExistingMasterToCat(catId, masterItem);
        }

        function allocateExistingMasterToCat(catId, masterItem) {
            const existingInCat = state.products.find(p => p.categoryId === catId && normalizeText(p.name) === normalizeText(masterItem.name));
            pushStateToUndo();
            if (!existingInCat) {
                state.products.push({
                    id: 'p' + Date.now(),
                    categoryId: catId,
                    name: masterItem.name, // Puxa sempre o nome oficial do banco de dados
                    qty: 0,
                    received: 0,
                    type: 'Unidade',
                    urgent: false,
                    pending: false,
                    selected: false
                });
            }
            const input = document.getElementById(`cat-input-${catId}`);
            if (input) input.value = '';
            const sugg = document.getElementById(`cat-sugg-${catId}`);
            if (sugg) sugg.classList.add('hidden');
            saveData();
            renderEstoque();
        }

        function submitCatQuickAdd(catId) {
            const input = document.getElementById(`cat-input-${catId}`);
            if (!input) return;
            const rawVal = input.value.trim();
            if (!rawVal) return;

            const normVal = normalizeText(rawVal);
            // 1. Verifica se já existe no banco de dados (ignorando acentos e maiúsculas)
            const exactMaster = state.masterData.find(m => normalizeText(m.name) === normVal);
            if (exactMaster) {
                allocateExistingMasterToCat(catId, exactMaster);
                return;
            }

            // 2. Se não existe, abre o modal obrigando a escolher uma categoria/grupo do Catálogo Base
            openMandatoryMasterRegistrationModal(catId, rawVal);
        }

        function openMandatoryMasterRegistrationModal(catId, typedProductName) {
            const supplier = state.categories.find(c => c.id === catId);
            const supplierName = supplier ? supplier.name : 'Fornecedor';
            const defaultGroups = SEED_MASTER.map(g => g.group);
            const currentGroups = [...new Set([...defaultGroups, ...state.masterData.map(m => m.group)])];

            let opts = `<option value="" disabled selected>Selecione uma categoria do catálogo...</option>`;
            opts += currentGroups.map(g => `<option value="${g}">${g}</option>`).join('');
            opts += `<option value="NOVO_GRUPO_OBRIGATORIO">+ Criar Nova Categoria no Catálogo</option>`;

            const similarItems = findSimilarMasterItems(typedProductName).slice(0, 3);
            let similarHtml = '';
            if (similarItems.length > 0) {
                similarHtml = `
                    <div class="bg-amber-50 border border-amber-200 p-2.5 rounded-xl">
                        <p class="text-[11px] font-extrabold text-amber-900 mb-1.5"><i class="fa-solid fa-magnifying-glass mr-1"></i>Itens semelhantes já no catálogo (toque para usar):</p>
                        <div class="flex flex-wrap gap-1.5">
                            ${similarItems.map(sim => `
                                <button type="button" onclick="closeModal(); selectMasterSuggestionForCat('${catId}', '${sim.id}')" class="text-xs bg-white border border-amber-300 text-amber-950 px-2.5 py-1 rounded-full font-bold hover:bg-amber-100 transition">
                                    ${sim.name} <span class="text-[10px] text-amber-700">(${sim.group})</span>
                                </button>
                            `).join('')}
                        </div>
                    </div>
                `;
            }

            const bodyHtml = `
                <div class="space-y-3">
                    <div class="bg-rose-50 border border-rose-200 p-3 rounded-xl text-rose-900 text-xs leading-relaxed">
                        <i class="fa-solid fa-triangle-exclamation text-rose-600 mr-1"></i>
                        O produto <b>"${typedProductName}"</b> ainda não existe no Banco de Dados (Catálogo Master). Para adicioná-lo ao fornecedor <b>${supplierName}</b>, escolha obrigatoriamente a categoria dele abaixo:
                    </div>

                    ${similarHtml}

                    <div>
                        <label class="font-bold text-[11px] uppercase text-zinc-500 block mb-1">Nome do Produto:</label>
                        <input type="text" id="obrig-prod-name" value="${typedProductName.replace(/"/g, '&quot;')}" class="border border-zinc-300 p-2.5 rounded-xl w-full font-bold text-zinc-900 outline-none focus:border-zinc-900">
                    </div>

                    <div>
                        <label class="font-bold text-[11px] uppercase text-zinc-500 block mb-1">Categoria no Catálogo Base (Obrigatório):</label>
                        <select id="obrig-prod-group" onchange="document.getElementById('obrig-new-group').classList.toggle('hidden', this.value !== 'NOVO_GRUPO_OBRIGATORIO'); document.getElementById('obrig-error').classList.add('hidden');" class="border border-zinc-300 p-2.5 rounded-xl w-full font-bold text-zinc-900 outline-none focus:border-zinc-900">
                            ${opts}
                        </select>
                    </div>

                    <input type="text" id="obrig-new-group" class="hidden border border-emerald-400 p-2.5 rounded-xl w-full bg-emerald-50 font-semibold text-zinc-900 outline-none" placeholder="Digite o nome da nova categoria...">
                    <p id="obrig-error" class="hidden text-xs font-bold text-rose-600"><i class="fa-solid fa-circle-exclamation mr-1"></i>Selecione ou crie uma categoria para continuar.</p>
                </div>
            `;

            showModal("Produto Não Cadastrado", bodyHtml, "Cadastrar e Adicionar", "bg-emerald-600 hover:bg-emerald-700", () => {
                const finalName = document.getElementById('obrig-prod-name').value.trim();
                let selectedGroup = document.getElementById('obrig-prod-group').value;
                if (selectedGroup === 'NOVO_GRUPO_OBRIGATORIO') {
                    selectedGroup = document.getElementById('obrig-new-group').value.trim();
                }

                if (!finalName || !selectedGroup) {
                    const err = document.getElementById('obrig-error');
                    if (err) err.classList.remove('hidden');
                    return false;
                }

                pushStateToUndo();

                // Verifica se o nome editado já existe no catálogo
                let masterObj = state.masterData.find(m => normalizeText(m.name) === normalizeText(finalName));
                if (!masterObj) {
                    masterObj = { id: 'm' + Date.now(), group: selectedGroup, name: finalName };
                    state.masterData.push(masterObj);
                }

                // Adiciona no fornecedor desejado
                const existsInSupplier = state.products.some(p => p.categoryId === catId && normalizeText(p.name) === normalizeText(masterObj.name));
                if (!existsInSupplier) {
                    state.products.push({
                        id: 'p' + (Date.now() + 1),
                        categoryId: catId,
                        name: masterObj.name,
                        qty: 0,
                        received: 0,
                        type: 'Unidade',
                        urgent: false,
                        pending: false,
                        selected: false
                    });
                }

                saveData();
                renderEstoque();
            });
        }

        // Fecha listas de sugestões ao clicar fora
        document.addEventListener('click', (e) => {
            if (!e.target.closest('.cat-quick-add-wrapper')) {
                document.querySelectorAll('.cat-sugg-box').forEach(el => el.classList.add('hidden'));
            }
        });

        function updateBulkBar() {
            const selectedCount = state.products.filter(p => p.selected).length;
            const bar = document.getElementById('global-bulk-bar');
            if (bar) {
                if (selectedCount > 0) {
                    bar.classList.remove('hidden');
                    document.getElementById('bulk-count-text').innerText = selectedCount;
                } else {
                    bar.classList.add('hidden');
                }
            }
        }

        function clearBulkSelection() {
            state.products.forEach(p => p.selected = false);
            saveData(); renderEstoque(); updateBulkBar();
        }

        function renderEstoque() {
            const catContainer = document.getElementById('categorias-container');
            const sortedCats = state.categories.sort((a, b) => a.order - b.order);
            const normGlobalSearch = normalizeText(uiState.searchQuery);

            let filterChipsHtml = `

                        <i class="fa-solid fa-plus text-emerald-400 mr-1"></i> Categoria
                    </button>
                </div>
                <div class="flex items-center gap-1.5 overflow-x-auto no-scrollbar pb-3">
                    <button onclick="setCatFilter('ALL')" class="shrink-0 px-3 py-1.5 rounded-full text-xs font-bold transition ${uiState.activeCatFilter === 'ALL' ? 'bg-zinc-950 text-white' : 'bg-white text-zinc-600 border border-zinc-200'}">Todos</button>
            `;
            sortedCats.forEach(c => {

            });
            filterChipsHtml += `</div>`;

            let html = filterChipsHtml;
            const catsToDisplay = uiState.activeCatFilter === 'ALL' ? sortedCats : sortedCats.filter(c => c.id === uiState.activeCatFilter);

            catsToDisplay.forEach((cat) => {
                const realIndex = sortedCats.findIndex(c => c.id === cat.id);
                let catProducts = state.products.filter(p => p.categoryId === cat.id);
                if (normGlobalSearch) {
                    catProducts = catProducts.filter(p => normalizeText(p.name).includes(normGlobalSearch));
                }

                const isCollapsed = uiState.collapsedCats[cat.id] && uiState.activeCatFilter === 'ALL' && !normGlobalSearch;
                const bgLight = `rgba(${parseInt(cat.color.slice(1, 3), 16)}, ${parseInt(cat.color.slice(3, 5), 16)}, ${parseInt(cat.color.slice(5, 7), 16)}, 0.12)`;
                
                html += `
                    <div class="cat-container bg-white rounded-2xl shadow-2xs border border-zinc-200/90 mb-3 overflow-visible transition-all duration-150" 
                         ondragover="handleDragOver(event)" ondragleave="handleDragLeave(event)" ondrop="handleDrop(event, '${cat.id}')">
                        <div class="bg-white px-3.5 py-2.5 flex justify-between items-center border-b border-zinc-100 cursor-move group rounded-t-2xl" style="border-left: 5px solid ${cat.color}" draggable="true" ondragstart="handleDragStart(event, 'cat', ${realIndex})" ondragend="handleDragEnd(event)">
                            <div class="flex items-center gap-2 flex-1 cursor-pointer" onclick="toggleCatCollapse('${cat.id}')">
                                <i class="fa-solid fa-grip-vertical text-zinc-300 text-xs"></i>
                                <span class="w-2.5 h-2.5 rounded-full shrink-0" style="background-color:${cat.color}"></span>
                                <h3 class="font-extrabold text-sm text-zinc-900">${cat.name}</h3>
                                <span class="text-[11px] font-bold px-2 py-0.5 rounded-full bg-zinc-100 text-zinc-600">${catProducts.length}</span>
                            </div>
                            <div class="flex items-center gap-1">
                                <button onclick="actionEditCategory('${cat.id}')" class="text-zinc-400 hover:text-zinc-800 w-7 h-7 rounded-lg hover:bg-zinc-100"><i class="fa-solid fa-palette text-xs"></i></button>
                                <button onclick="actionDeleteCategory('${cat.id}')" class="text-zinc-400 hover:text-rose-600 w-7 h-7 rounded-lg hover:bg-rose-50"><i class="fa-solid fa-trash text-xs"></i></button>
                                <button onclick="toggleCatCollapse('${cat.id}')" class="text-zinc-400 hover:text-zinc-800 w-7 h-7 rounded-lg flex items-center justify-center">
                                    <i class="fa-solid fa-chevron-${isCollapsed ? 'down' : 'up'} text-[11px]"></i>
                                </button>
                            </div>
                        </div>

                        <div class="${isCollapsed ? 'hidden' : 'p-2.5 space-y-2'}">
                            <!-- Barra de Adição Escrevendo com Busca Semelhante e Sem Acento -->
                            <div class="relative cat-quick-add-wrapper">

                                               oninput="handleCatQuickInput('${cat.id}', this.value)"
                                               onkeydown="if(event.key === 'Enter'){ event.preventDefault(); submitCatQuickAdd('${cat.id}'); }"
                                               placeholder="Adicionar item escrevendo em ${cat.name}..."

                                               class="w-full pl-8 pr-3 py-1.5 bg-zinc-50 border border-zinc-200 rounded-xl text-xs font-semibold text-zinc-900 placeholder-zinc-400 focus:bg-white focus:outline-none focus:border-zinc-900 transition">
                                    </div>
                                    <button type="button" onclick="submitCatQuickAdd('${cat.id}')" class="bg-zinc-950 hover:bg-zinc-800 text-white px-3 py-1.5 rounded-xl text-xs font-extrabold transition shrink-0 flex items-center gap-1">
                                        <i class="fa-solid fa-plus text-emerald-400 text-[10px]"></i> Adicionar
                                    </button>
                                </div>
                                <div id="cat-sugg-${cat.id}" class="cat-sugg-box hidden absolute left-0 right-0 top-full mt-1 bg-white border border-zinc-200 rounded-xl shadow-xl z-30 max-h-52 overflow-y-auto"></div>
                            </div>
                `;

                if (catProducts.length === 0) html += `<div class="text-xs text-zinc-400 py-3 text-center">Sem produtos alocados. Escreva acima ou arraste do catálogo.</div>`;

                catProducts.forEach(prod => {
                    const isSelected = prod.qty > 0;
                    
                    const isMentioned = state.notas.some(n => n.text.toLowerCase().includes('@' + prod.name.toLowerCase()));
                    const mentionBadge = isMentioned ? `<button onclick="openNoteFor('${prod.name}')" class="ml-1.5 text-amber-500 bg-amber-50 border border-amber-200 px-1.5 py-0.5 rounded text-[10px] font-black hover:bg-amber-100 transition" title="Ver anotação"><i class="fa-solid fa-at"></i> Nota</button>` : '';

                                        <span class="w-7 text-center font-extrabold text-sm text-zinc-900">${prod.qty}</span>
                                        <button onclick="updateQty('${prod.id}', 1, 'estoque')" class="w-7 h-7 rounded-lg bg-zinc-950 text-white hover:bg-zinc-800 font-bold text-sm transition">+</button>
                                    </div>
                                </div>
                            </div>
                            
                            ${isSelected ? `

        function renderMasterData() {
            const container = document.getElementById('master-data-list');

            state.masterData.forEach(item => {
                if (!allGroups.includes(item.group)) allGroups.push(item.group);

            for (const [groupName, items] of Object.entries(grouped)) {
                if (uiState.activeMasterGroup !== 'ALL' && uiState.activeMasterGroup !== groupName) continue;

                html += `<div class="border border-zinc-200/80 rounded-xl bg-zinc-50/50 overflow-hidden"><div class="bg-zinc-100/80 px-3 py-1.5 border-b border-zinc-200/60 font-extrabold text-[11px] uppercase tracking-wider text-zinc-600">${groupName}</div><div class="p-2.5 flex flex-wrap gap-1.5">`;

        function updateQty(id, change, fromView) {
            const prod = state.products.find(p => p.id === id);
            if (!prod) return;

            if (fromView === 'lista') {
                prod.received = Math.max(0, prod.received + change);
            } else {
                prod.qty = Math.max(0, prod.qty + change);
                prod.received = prod.qty; 
                if (prod.qty === 0) { prod.urgent = false; prod.pending = false; }
            }
            saveData(); 
            if(fromView === 'estoque') renderEstoque();
            if(fromView === 'lista') renderLista();
        }

                                    </div>

                                <div class="flex items-center gap-1 bg-zinc-100 border border-zinc-200 rounded-xl p-0.5">

                            <button onclick="actionToggleRestore('${prod.id}')" class="text-zinc-950 font-extrabold text-[11px] bg-emerald-400 px-2.5 py-1 rounded-lg hover:bg-emerald-300">Restaurar</button>

        function actionToggleRestore(id) {
            const prod = state.products.find(p => p.id === id);
            if (prod) { prod.pending = false; prod.received = prod.qty; saveData(); renderLista(); }
        }

        function actionCheckDiscrepancies() {
            const discrepancies = [];
            state.products.forEach(p => {
                if (p.qty > 0 && !p.pending) {
                    if (p.received < p.qty) discrepancies.push({ type: 'missing', prod: p, diff: p.qty - p.received });
                    else if (p.received > p.qty) discrepancies.push({ type: 'extra', prod: p, diff: p.received - p.qty });
                }
            });

            if (discrepancies.length > 0) {
                let html = `<div class="space-y-3 max-h-[60vh] overflow-y-auto pr-1 no-scrollbar">`;
                discrepancies.forEach((d, i) => {
                    if (d.type === 'missing') {
                        html += `
                            <div class="p-3 bg-amber-50 border border-amber-200 rounded-xl">
                                <p class="text-[13px] font-bold text-amber-900 mb-2 leading-tight">Faltaram <span class="text-rose-600">${d.diff}x</span> ${d.prod.name}</p>
                                <label class="flex items-center gap-2 text-xs text-zinc-700 font-semibold mb-2 cursor-pointer">
                                    <input type="checkbox" id="chk-adiar-${i}" class="w-4 h-4 accent-emerald-600 rounded" checked onchange="document.getElementById('urg-${i}').classList.toggle('opacity-40')"> Adiar para o próximo pedido
                                </label>
                                <div id="urg-${i}" class="pl-6 transition-opacity">
                                    <label class="flex items-center gap-2 text-xs text-rose-700 font-bold cursor-pointer">
                                        <input type="checkbox" id="chk-urg-${i}" class="w-4 h-4 accent-rose-600 rounded"> Entra como URGENTE
                                    </label>
                                </div>
                            </div>
                        `;
                    } else {
                        html += `
                            <div class="p-3 bg-blue-50 border border-blue-200 rounded-xl">
                                <p class="text-[13px] font-bold text-blue-900 mb-2 leading-tight">Vieram <span class="text-blue-700">${d.diff}x</span> a mais de ${d.prod.name}</p>
                                <label class="flex items-center gap-2 text-xs text-zinc-700 font-semibold cursor-pointer">
                                    <input type="checkbox" id="chk-extra-${i}" class="w-4 h-4 accent-emerald-600 rounded" checked> Registrar extra no histórico
                                </label>
                            </div>
                        `;
                    }
                });
                html += `</div>`;
                showModal("Resolver Divergências", html, "Confirmar e Fechar", "bg-zinc-950 hover:bg-zinc-800", () => {
                    const choices = discrepancies.map((d, i) => {
                        if (d.type === 'missing') return { adiar: document.getElementById(`chk-adiar-${i}`).checked, urg: document.getElementById(`chk-urg-${i}`).checked };
                        else return { reg: document.getElementById(`chk-extra-${i}`).checked };
                    });
                    executeFinalize(discrepancies, choices);
                });
            } else {
                showModal("Finalizar Compras", "<p class='text-zinc-700 text-sm'>Todos os itens conferem perfeitamente com o pedido inicial.</p><p class='font-bold mt-2 text-zinc-900'>Deseja finalizar a compra e registrar no histórico?</p>", "Finalizar Compra", "bg-emerald-600 hover:bg-emerald-700", () => {
                    executeFinalize([], []);
                });
            }
        }

        function executeFinalize(discrepancies, choices) {
            pushStateToUndo();

            const currentMonth = new Date().toISOString().slice(0, 7);
            const exactDateStr = new Date().toLocaleString('pt-BR', { day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit' });
            if (!state.history[currentMonth]) state.history[currentMonth] = {};

            const remaining = [];

            state.products.forEach(p => {
                if (p.qty > 0) {
                    if (p.pending) {
                        p.pending = false; 
                        remaining.push(p);
                        return;
                    }

                    let toHistoryQty = p.received;
                    let adiarMissing = false, missingDiff = 0, markUrg = false;
                    const dIdx = discrepancies.findIndex(d => d.prod.id === p.id);

                    if (dIdx > -1) {
                        const d = discrepancies[dIdx], c = choices[dIdx];
                        if (d.type === 'missing') {
                            toHistoryQty = p.received; 
                            if (c.adiar) { adiarMissing = true; missingDiff = d.diff; markUrg = c.urg; }
                        } else if (d.type === 'extra') {
                            toHistoryQty = c.reg ? p.received : p.qty; 
                        }
                    }

                    if (toHistoryQty > 0) {
                        const cat = state.categories.find(c => c.id === p.categoryId) || { name: 'Outros', color: '#9ca3af' };
                        if (!state.history[currentMonth][p.categoryId]) state.history[currentMonth][p.categoryId] = { name: cat.name, color: cat.color, items: {} };
                        
                        const key = `${p.name} (${p.type})`;
                        const hCat = state.history[currentMonth][p.categoryId].items;
                        
                        if (!hCat[key]) hCat[key] = { total: 0, entries: [] };
                        if (hCat[key].dates && !hCat[key].entries) { hCat[key].entries = hCat[key].dates.map(d => ({ date: d, qty: '?' })); delete hCat[key].dates; }
                        
                        hCat[key].total += toHistoryQty;
                        hCat[key].entries.push({ date: exactDateStr, qty: toHistoryQty });
                    }

                    if (adiarMissing) {
                        p.qty = missingDiff; p.received = missingDiff; p.pending = true;
                        if (markUrg) p.urgent = true;
                        remaining.push(p);
                    } else {
                        p.qty = 0; p.received = 0; p.urgent = false; p.pending = false;
                        remaining.push(p); 
                    }
                } else {
                    remaining.push(p);
                }
            });

            state.products = remaining;
            saveData(); 
            renderLista(); 
        }

        function renderNotas(filterKeyword = '') {
            const container = document.getElementById('notes-list');
            const searchVal = document.getElementById('note-search').value.toLowerCase();
            const keyword = filterKeyword || searchVal;

            if (state.notas.length === 0) {
                container.innerHTML = '<div class="text-center p-6 text-zinc-400 text-xs font-semibold border border-dashed border-zinc-300 rounded-2xl">Nenhuma nota criada.</div>';
                return;
            }

            let html = '';
            state.notas.slice().reverse().forEach(n => {

                const formattedText = n.text.replace(/@([\wÀ-ÿ\s]+)(?=\s|$|\.|,|!|\?)/g, (match) => {
                    return `<span class="text-amber-600 font-bold bg-amber-50 px-1 rounded border border-amber-100">${match}</span>`;
                });

                html += `

                    </div>

        }

        function actionSaveNote() {
            const input = document.getElementById('note-input');
            const text = input.value.trim();
            if(!text) return;
            
            pushStateToUndo();
            state.notas.push({ id: 'n' + Date.now(), text: text, date: new Date().toLocaleString('pt-BR') });
            
            const regex = /[\p{Emoji_Presentation}\p{Extended_Pictographic}]/gu;
            const found = text.match(regex);
            if (found) {
                state.emojis = [...new Set([...found, ...state.emojis])].slice(0, 30);
            }

            input.value = '';
            saveData(); 
            renderNotas(); 
            renderEmojis();
            renderEstoque();
        }

        function actionDeleteNote(id) {
            pushStateToUndo();
            state.notas = state.notas.filter(n => n.id !== id);
            saveData(); renderNotas(); renderEstoque();
        }

                    text += "\n";

            });
            window.open(`https://wa.me/?text=${encodeURIComponent(text)}`, '_blank');

                            <div class="flex justify-end pb-1">
                                <button onclick="actionDeleteMonth('${month}', '${monthName}')" class="text-[10px] bg-white border border-rose-200 text-rose-600 px-2.5 py-1.5 rounded-lg font-bold shadow-2xs hover:bg-rose-50 hover:border-rose-300 transition flex items-center gap-1.5">
                                    <i class="fa-solid fa-trash"></i> Apagar Mês
                                </button>
                            </div>
                `;

                for (const [catId, catData] of Object.entries(state.history[month])) {
                    html += `
                        <div class="border border-zinc-200 rounded-xl bg-white shadow-2xs overflow-hidden">
                            <h4 class="font-extrabold px-3 py-2 text-xs flex items-center gap-2 border-b border-zinc-100" style="background-color: ${hexToRgba(catData.color, 0.1)}">
                                <div class="w-2.5 h-2.5 rounded-full" style="background-color: ${catData.color}"></div> ${catData.name}
                            </h4>
                            <table class="w-full text-xs text-left">
                                <tbody class="divide-y divide-zinc-100">
                    `;
                    for (const [itemName, itemData] of Object.entries(catData.items)) {
                        const entriesHtml = itemData.entries 
                            ? itemData.entries.map(e => `<div class="flex justify-between items-center text-zinc-500 py-0.5"><span class="text-[9px]"><i class="fa-solid fa-arrow-turn-down ml-1 mr-1 text-zinc-300"></i> ${e.date}</span> <b class="text-zinc-700 text-[10px]">+${e.qty}</b></div>`).join('') 
                            : (itemData.dates ? itemData.dates.map(d => `<div class="flex justify-between items-center text-zinc-500 py-0.5"><span class="text-[9px]"><i class="fa-solid fa-arrow-turn-down ml-1 mr-1 text-zinc-300"></i> ${d}</span></div>`).join('') : '');

                        html += `
                            <tr class="border-t border-zinc-100/60 hover:bg-zinc-50/80 transition-colors">
                                <td class="px-3.5 py-3">
                                    <div class="font-bold text-zinc-800 text-xs">${itemName}</div>
                                    ${entriesHtml ? `<div class="mt-1.5 pl-1 border-l-2 border-zinc-200 bg-zinc-50/50 rounded p-1">${entriesHtml}</div>` : ''}
                                </td>
                                <td class="px-3.5 py-3 text-right font-extrabold text-emerald-600 align-top text-sm">${itemData.total}</td>
                            </tr>
                        `;
                    }
                    html += `</tbody></table></div>`;
                }
                html += `</div></div>`;
            });
            container.innerHTML = html;
        }

        function actionDeleteMonth(monthKey, monthName) {
            showModal("Excluir Mês", `<p class='text-sm text-zinc-700'>Tem certeza que deseja apagar todo o registro de <b>${monthName}</b>?</p><p class='text-xs text-zinc-500 mt-2'>Os dados removidos podem ser restaurados usando o botão "Desfazer".</p>`, "Excluir", "bg-rose-600 hover:bg-rose-700", () => {
                pushStateToUndo();
                delete state.history[monthKey];
                saveData(); 
                renderHistorico();
            });
        }

        function actionResetYear() {
            showModal("Virada de Ano", "<p class='text-rose-600 font-bold'>Esta ação apagará todos os dados arquivados!</p>", "Zerar Tudo", "bg-rose-600 hover:bg-rose-700", () => {
                pushStateToUndo();
                state.history = {}; state.yearResetPending = false;
                saveData(); renderHistorico();
            });
        }

        // Ações Rápidas Categorias/Produtos...
        function actionAddCategory() {
            showModal("Nova Categoria", `<label class="font-bold text-xs uppercase text-zinc-500">Local:</label><input type="text" id="ncat-name" class="border border-zinc-300 p-2.5 rounded-xl w-full font-semibold outline-none focus:border-zinc-900 mt-1"><label class="font-bold text-xs uppercase text-zinc-500 mt-3 block">Cor:</label><input type="color" id="ncat-color" class="w-full h-11 p-1 border border-zinc-300 rounded-xl mt-1 cursor-pointer" value="#10b981">`, "Criar", "bg-zinc-950", () => {
                const n = document.getElementById('ncat-name').value.trim(), c = document.getElementById('ncat-color').value;
                if (!n) return false; pushStateToUndo(); state.categories.push({ id: 'c' + Date.now(), name: n, color: c, order: state.categories.length }); saveData(); renderEstoque();
            });
        }
        function actionEditCategory(id) {
            const cat = state.categories.find(c => c.id === id);
            showModal("Editar Categoria", `<label class="font-bold text-xs text-zinc-500">Nova Cor para ${cat.name}:</label><input type="color" id="ecat-color" class="w-full h-12 p-1 border border-zinc-300 rounded-xl mt-2 cursor-pointer" value="${cat.color}">`, "Salvar", "bg-emerald-600 hover:bg-emerald-700", () => { pushStateToUndo(); cat.color = document.getElementById('ecat-color').value; saveData(); renderEstoque(); });
        }
        function actionDeleteCategory(id) { showModal("Excluir", "<p class='text-sm text-zinc-700'>Excluir esta categoria e desvincular itens?</p>", "Excluir", "bg-rose-600 hover:bg-rose-700", () => { pushStateToUndo(); state.categories = state.categories.filter(c => c.id !== id); state.products = state.products.filter(p => p.categoryId !== id); if(uiState.activeCatFilter===id) uiState.activeCatFilter='ALL'; saveData(); renderEstoque(); }); }
        
        function toggleProductSelection(id) { const p = state.products.find(x => x.id === id); if(p){ p.selected = !p.selected; saveData(); renderEstoque(); updateBulkBar(); } }
        function actionGlobalBulkMove() {
            const sel = state.products.filter(p => p.selected);
            if(sel.length===0) return;
            const opts = state.categories.sort((a,b)=>a.order-b.order).map(c => `<option value="${c.id}">${c.name}</option>`).join('');
            showModal("Mover em Massa", `<p class="mb-3 text-sm font-semibold text-zinc-700">Mover ${sel.length} itens para:</p><select id="bdest" class="border border-zinc-300 p-2.5 rounded-xl w-full font-bold outline-none focus:border-zinc-900">${opts}</select>`, "Mover", "bg-zinc-950 hover:bg-zinc-800", () => { pushStateToUndo(); const dest = document.getElementById('bdest').value; sel.forEach(p => { p.categoryId = dest; p.selected = false; }); saveData(); renderEstoque(); updateBulkBar(); });
        }
        function clearBulkSelection() { state.products.forEach(p => p.selected = false); saveData(); renderEstoque(); updateBulkBar(); }

        function actionDeleteProduct(id) { showModal("Remover", "<p class='text-sm text-zinc-700'>Remover este item da categoria atual?</p>", "Remover", "bg-rose-600 hover:bg-rose-700", () => { pushStateToUndo(); state.products = state.products.filter(p => p.id !== id); saveData(); renderEstoque(); }); }
        function actionAddMasterItem() {
            const defaultGroups = SEED_MASTER.map(g => g.group);
            const g = [...new Set([...defaultGroups, ...state.masterData.map(m => m.group)])];
            const opts = g.map(x => `<option value="${x}">${x}</option>`).join('') + `<option value="NOVO">+ Criar Novo Grupo</option>`;
            showModal("Novo no Catálogo", `<input type="text" id="nm-name" class="border border-zinc-300 p-2.5 rounded-xl w-full mb-3 font-semibold outline-none focus:border-zinc-900" placeholder="Nome do Produto"><select id="nm-grp" onchange="document.getElementById('nmg-name').classList.toggle('hidden', this.value !== 'NOVO')" class="border border-zinc-300 p-2.5 rounded-xl w-full mb-3 font-semibold outline-none focus:border-zinc-900">${opts}</select><input type="text" id="nmg-name" class="hidden border border-emerald-400 p-2.5 rounded-xl w-full bg-emerald-50 font-semibold outline-none focus:border-emerald-600" placeholder="Nome do Novo Grupo">`, "Adicionar", "bg-emerald-600 hover:bg-emerald-700", () => {
                const n = document.getElementById('nm-name').value.trim(); let grp = document.getElementById('nm-grp').value; if(grp==='NOVO') grp = document.getElementById('nmg-name').value.trim();
                if(!n || !grp) return false; pushStateToUndo(); state.masterData.push({ id: 'm' + Date.now(), group: grp, name: n }); saveData(); renderEstoque();
            });
        }
        function actionDeleteMasterItem(id) { showModal("Excluir", "<p class='text-sm text-zinc-700'>Remover definitivamente do Catálogo Base?</p>", "Excluir", "bg-rose-600 hover:bg-rose-700", () => { pushStateToUndo(); state.masterData = state.masterData.filter(m => m.id !== id); saveData(); renderEstoque(); }); }
        function actionMoveFromMasterToCat(id) {
            const item = state.masterData.find(m => m.id === id); if(state.categories.length===0) return;
            const opts = state.categories.sort((a,b)=>a.order-b.order).map(c => `<option value="${c.id}">${c.name}</option>`).join('');
            showModal("Alocar", `<p class="mb-3 text-sm text-zinc-700">Alocar <b>${item.name}</b> em qual fornecedor?</p><select id="dcat" class="border border-zinc-300 p-2.5 rounded-xl w-full font-bold outline-none focus:border-zinc-900">${opts}</select>`, "Adicionar", "bg-zinc-950 hover:bg-zinc-800", () => {
                const cId = document.getElementById('dcat').value, ext = state.products.find(p => normalizeText(p.name) === normalizeText(item.name) && p.categoryId === cId);
                if(!ext) { pushStateToUndo(); state.products.push({ id: 'p'+Date.now(), categoryId: cId, name: item.name, qty: 0, received: 0, type: 'Unidade', urgent: false, pending: false, selected: false }); }
                saveData(); renderEstoque();
            });
        }
        function updateType(id, t) { const p = state.products.find(x => x.id === id); if(p){ pushStateToUndo(); p.type = t; saveData(); } }
        function toggleUrgent(id) { const p = state.products.find(x => x.id === id); if(p){ pushStateToUndo(); p.urgent = !p.urgent; saveData(); renderEstoque(); } }

        window.onload = init;
    </script>
</body>
</html>
