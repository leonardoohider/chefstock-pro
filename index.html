        let state = {

        // --- PERSISTÊNCIA LOCAL DE ABAS DE FORNECEDORES ---
        function loadCollapsedPrefs() {
            try {
                const raw = localStorage.getItem('chefstock_collapsed_cats');
                if (raw) {
                    const parsed = JSON.parse(raw);
                    state.collapsedCats = { ...(state.collapsedCats || {}), ...parsed };

            try {
                localStorage.setItem('chefstock_collapsed_cats', JSON.stringify(state.collapsedCats || {}));
            } catch (e) {}
        }

        // --- INDICADOR DE CONEXÃO E SINCRONIZAÇÃO ---
        function setSyncIndicator(status) {
            const dot = document.getElementById('sync-dot');
            const text = document.getElementById('sync-text');
            if (!dot || !text) return;

            if (!navigator.onLine || status === 'offline') {
                dot.className = 'w-1.5 h-1.5 rounded-full bg-amber-400';
                text.innerText = 'Offline (Local)';
            } else if (status === 'syncing') {
                dot.className = 'w-1.5 h-1.5 rounded-full bg-blue-400 animate-ping';
                text.innerText = 'Sincronizando...';
            } else {
                dot.className = 'w-1.5 h-1.5 rounded-full bg-emerald-400';
                text.innerText = 'Sincronizado';
            }
        }

        window.addEventListener('online', () => { setSyncIndicator('online'); saveData(); });
        window.addEventListener('offline', () => setSyncIndicator('offline'));

        // --- FUNÇÕES DE NORMALIZAÇÃO (SEM ACENTO) E SIMILARIDADE DE PALAVRAS ---
        function normalizeText(str) {
            return (str || '')
                .toString()
                .normalize('NFD')
                .replace(/[\u0300-\u036f]/g, '')
                .toLowerCase()
                .trim();
        }

        function editDistance(a, b) {
            if (a.length === 0) return b.length;
            if (b.length === 0) return a.length;
            const matrix = [];
            for (let i = 0; i <= b.length; i++) matrix[i] = [i];
            for (let j = 0; j <= a.length; j++) matrix[0][j] = j;
            for (let i = 1; i <= b.length; i++) {
                for (let j = 1; j <= a.length; j++) {
                    if (b.charAt(i - 1) === a.charAt(j - 1)) {
                        matrix[i][j] = matrix[i - 1][j - 1];
                    } else {
                        matrix[i][j] = Math.min(
                            matrix[i - 1][j - 1] + 1,
                            Math.min(matrix[i][j - 1] + 1, matrix[i - 1][j] + 1)
                        );
                    }
                }
            }
            return matrix[b.length][a.length];
        }

        function findSimilarMasterItems(rawQuery) {
            const q = normalizeText(rawQuery);
            if (!q) return [];

            const scored = [];
            state.masterData.forEach(item => {
                const normName = normalizeText(item.name);
                const words = normName.split(/\s+/);
                let score = 0;

                if (normName === q) {
                    score = 100;
                } else if (normName.startsWith(q)) {
                    score = 90;
                } else if (words.some(w => w.startsWith(q))) {
                    score = 80;
                } else if (normName.includes(q)) {
                    score = 70;
                } else if (q.length >= 3) {
                    const minWordDist = Math.min(...words.map(w => editDistance(q, w)), editDistance(q, normName));
                    const maxAllowed = q.length <= 4 ? 1 : 2;
                    if (minWordDist <= maxAllowed) {
                        score = 60 - (minWordDist * 10);
                    }
                }

                if (score > 0) {
                    scored.push({ item, score });
                }
            });

            scored.sort((a, b) => b.score - a.score || a.item.name.localeCompare(b.item.name));
            return scored.map(s => s.item);
        }

        function getRememberedMeasure(productName) {
            const key = normalizeText(productName);
            return (state.measureMemory && state.measureMemory[key]) ? state.measureMemory[key] : 'Unidade';
        }

        function rememberMeasure(productName, measureType) {
            if (!state.measureMemory) state.measureMemory = {};
            state.measureMemory[normalizeText(productName)] = measureType;
        }

        function getMasterItemAllocation(itemName) {
            const allocatedProds = state.products.filter(p => p.name === itemName);
            const cats = allocatedProds.map(p => state.categories.find(c => c.id === p.categoryId)).filter(Boolean);
            const uniqueColors = [...new Set(cats.map(c => c.color))];
            if (uniqueColors.length === 0) return { isAllocated: false, colors: [] };
            return { isAllocated: true, colors: uniqueColors };
        }

        async function init() {
            await loadData();
            loadCollapsedPrefs();
            loadStacks();
            if (!state.categories || state.categories.length === 0) {
                state.categories = JSON.parse(JSON.stringify(SEED_CATEGORIES));
            }
            if (!state.masterData || state.masterData.length === 0) {
                let mId = 1;
                SEED_MASTER.forEach(g => {
                    g.items.forEach(itemName => {
                        state.masterData.push({ id: 'm' + mId++, group: g.group, name: itemName });
                    });
                });
            }
            if (!state.emojis || state.emojis.length === 0) {
                state.emojis = ['🍅','🧅','🥔','🥬','🥩','🍗','🐟','🥚','🧀','🧈','🥛','🍞','🧊','📦','✅','❌','⚠️','🚨','🚚'];
            }

            saveData();
            startRealtimeListener();
            checkYearResetLogic();
            renderEstoque();
            renderEmojis();
            updateBadge();
        }

        function sanitizeStateStructure() {
            if (!state.history) state.history = {};
            if (!state.masterData) state.masterData = [];
            if (!state.categories) state.categories = [];
            if (!state.products) state.products = [];
            if (!state.notas) state.notas = [];
            if (!state.emojis) state.emojis = [];
            if (!state.measureMemory) state.measureMemory = {};
            if (!state.templates) state.templates = [];
            if (!state.collapsedCats) state.collapsedCats = {};
            uiState.collapsedCats = state.collapsedCats;
            if (state.lastBackup !== undefined) delete state.lastBackup;

            state.products.forEach(p => {
                if (p.pending === undefined) p.pending = false;
                if (p.selected === undefined) p.selected = false;
                if (p.received === undefined) p.received = p.qty;
                if (p.type === undefined) p.type = getRememberedMeasure(p.name);
                if (p.checked === undefined) p.checked = false;
            });
        }

        function startRealtimeListener() {
            if (realtimeUnsubscribe) return;
            try {
                const docRef = db.collection("sistema").doc("estoque_principal");
                realtimeUnsubscribe = docRef.onSnapshot((docSnap) => {
                    if (docSnap.exists && !docSnap.metadata.hasPendingWrites && !isSavingToCloud) {
                        state = docSnap.data();
                        sanitizeStateStructure();
                        loadCollapsedPrefs();
                        localStorage.setItem('chefstock_pro_v3_data', JSON.stringify(state));
                        updateBadge();
                        setSyncIndicator('online');
                        const activeTag = document.activeElement ? document.activeElement.tagName : '';
                        if (activeTag !== 'INPUT' && activeTag !== 'TEXTAREA' && activeTag !== 'SELECT') {
                            refreshCurrentTabView();
                        }
                    }
                }, () => {
                    setSyncIndicator('offline');
                });
            } catch (e) {
                setSyncIndicator('offline');
            }
        }

        function refreshCurrentTabView() {
            if (uiState.currentTab === 'estoque') renderEstoque();
            if (uiState.currentTab === 'lista') renderLista();
            if (uiState.currentTab === 'historico') renderHistorico();
            if (uiState.currentTab === 'notas') { renderNotas(); renderEmojis(); }
        }

        function loadStacks() {
            try {
                let s = localStorage.getItem('chefstock_stacks');
                if(s) { let parsed = JSON.parse(s); undoStack = parsed.undo || []; redoStack = parsed.redo || []; }
            } catch(e){}
        }

        function saveStacks() {
            localStorage.setItem('chefstock_stacks', JSON.stringify({
                undo: undoStack.slice(-15),
                redo: redoStack.slice(-15)
            }));
        }

        function pushStateToUndo() {
            if (state.lastBackup) delete state.lastBackup; 
            undoStack.push(JSON.stringify(state));
            redoStack = []; 
            if (undoStack.length > 15) undoStack.shift();
            saveStacks();
        }

        function actionUndo() {
            if (undoStack.length === 0) return;
            showModal("Desfazer Ação", "<p class='text-zinc-700 text-sm'>Deseja voltar no tempo e <b>desfazer</b> a última alteração feita?</p>", "Sim, Desfazer", "bg-amber-500 text-zinc-950", () => {
                redoStack.push(JSON.stringify(state)); 
                state = JSON.parse(undoStack.pop());   
                sanitizeStateStructure();
                saveCollapsedPrefs();
                saveStacks(); saveData(); 
                renderHistorico(); renderEstoque(); renderLista(); renderNotas(); renderEmojis();
            });
        }

        function actionRedo() {
            if (redoStack.length === 0) return;
            showModal("Refazer Ação", "<p class='text-zinc-700 text-sm'>Deseja avançar no tempo e <b>refazer</b> a ação que acabou de ser desfeita?</p>", "Sim, Refazer", "bg-emerald-500 text-zinc-950", () => {
                undoStack.push(JSON.stringify(state)); 
                state = JSON.parse(redoStack.pop());   
                sanitizeStateStructure();
                saveCollapsedPrefs();
                saveStacks(); saveData(); 
                renderHistorico(); renderEstoque(); renderLista(); renderNotas(); renderEmojis();
            });
        }

        async function loadData() {
            try {
                setSyncIndicator('syncing');
                const docRef = db.collection("sistema").doc("estoque_principal");
                const docSnap = await docRef.get();
                if (docSnap.exists) {
                    state = docSnap.data();
                    localStorage.setItem('chefstock_pro_v3_data', JSON.stringify(state));
                    setSyncIndicator('online');
                } else {
                    const stored = localStorage.getItem('chefstock_pro_v3_data');
                    if (stored) state = JSON.parse(stored);
                    setSyncIndicator('online');
                }
            } catch (e) {
                const stored = localStorage.getItem('chefstock_pro_v3_data');
                if (stored) state = JSON.parse(stored);
                setSyncIndicator('offline');
            }
            sanitizeStateStructure();
        }

        async function saveData() {
            saveCollapsedPrefs();
            localStorage.setItem('chefstock_pro_v3_data', JSON.stringify(state));
            updateBadge();
            if (!navigator.onLine) {
                setSyncIndicator('offline');
                return;
            }
            try {
                isSavingToCloud = true;
                setSyncIndicator('syncing');
                await db.collection("sistema").doc("estoque_principal").set(JSON.parse(JSON.stringify(state)));
                setSyncIndicator('online');
            } catch (e) {
                setSyncIndicator('offline');
            } finally {
                isSavingToCloud = false;
            }
        }

        // --- RENOMEAÇÃO GLOBAL DE PRODUTO (ATUALIZA MASTER + FORNECEDORES + MODELOS + NOTAS) ---
        function renameProductGlobally(oldName, rawNewName) {
            const newName = (rawNewName || '').trim();
            if (!newName || newName === oldName) return false;

            pushStateToUndo();
            const normOld = normalizeText(oldName);

            // 1. Atualiza no Catálogo Master
            state.masterData.forEach(m => {
                if (normalizeText(m.name) === normOld) m.name = newName;
            });

            // 2. Atualiza em todas as listas de fornecedores
            state.products.forEach(p => {
                if (normalizeText(p.name) === normOld) p.name = newName;
            });

            // 3. Atualiza nos Modelos de Pedidos salvos
            if (state.templates) {
                state.templates.forEach(t => {
                    t.items.forEach(it => {
                        if (normalizeText(it.name) === normOld) it.name = newName;
                    });
                });
            }

            // 4. Atualiza memória de unidade de medida
            if (state.measureMemory && state.measureMemory[normOld]) {
                state.measureMemory[normalizeText(newName)] = state.measureMemory[normOld];
            }

            // 5. Atualiza menções @ nas notas
            const escapedOld = oldName.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
            const rgxOld = new RegExp(`@${escapedOld}(?![\\wÀ-ÿ])`, 'gi');
            state.notas.forEach(n => {
                n.text = n.text.replace(rgxOld, `@${newName}`);
            });

            saveData();
            renderEstoque();
            renderLista();
            return true;
        }

        // --- DRAG & DROP DE CATEGORIAS, CATÁLOGO E REORDENAÇÃO INTERNA DE PRODUTOS ---
        function handleDragStart(e, type, idOrIndex) {
            clearMasterItemLongPress();
            e.stopPropagation();
            e.dataTransfer.setData('text/plain', type + '|' + idOrIndex);
            setTimeout(() => e.target.classList.add('dragging'), 0);
        }

        function handleDragOver(e) { e.preventDefault(); e.currentTarget.classList.add('drag-target-hover'); }
        function handleDragLeave(e) { e.currentTarget.classList.remove('drag-target-hover'); }
        function handleDragEnd(e) {
            e.target.classList.remove('dragging');
            document.querySelectorAll('.cat-container, .master-group-container').forEach(el => el.classList.remove('drag-target-hover'));
            document.querySelectorAll('.prod-card-item').forEach(el => el.classList.remove('prod-drag-over'));
        }

        function handleDrop(e, targetCatId) {
            e.preventDefault();
            e.currentTarget.classList.remove('drag-target-hover');
            const dataStr = e.dataTransfer.getData('text/plain'); if(!dataStr) return;
            const [type, payload] = dataStr.split('|');

            if (type === 'master') {
                const item = state.masterData.find(m => m.id === payload);
                if (item) {
                    const exists = state.products.find(p => p.name === item.name && p.categoryId === targetCatId);
                    if (!exists) {
                        pushStateToUndo();
                        state.products.push({
                            id: 'p' + Date.now(),
                            categoryId: targetCatId,
                            name: item.name,
                            qty: 0,
                            received: 0,
                            type: getRememberedMeasure(item.name),
                            urgent: false,
                            pending: false,
                            selected: false,
                            checked: false
                        });
                    }
                    saveData(); renderEstoque();
                }
            } else if (type === 'cat') {
                const dragIndex = parseInt(payload); const targetIndex = state.categories.findIndex(c => c.id === targetCatId);
                if (dragIndex !== targetIndex && targetIndex !== -1) {
                    pushStateToUndo();
                    const catArr = state.categories.sort((a,b) => a.order - b.order);
                    const movedItem = catArr.splice(dragIndex, 1)[0];
                    catArr.splice(targetIndex, 0, movedItem);
                    catArr.forEach((c, i) => c.order = i); state.categories = catArr;
                    saveData(); renderEstoque();
                }
            }
            // Nota: se type === 'prod', ignoramos o drop em outra categoria para impedir que mude de lista
        }

        // Reordena produtos APENAS dentro da mesma categoria de fornecedor
        function handleProdDragOver(e) {
            e.preventDefault();
            e.stopPropagation();
            e.currentTarget.classList.add('prod-drag-over');
        }

        function handleProdDragLeave(e) {
            e.currentTarget.classList.remove('prod-drag-over');
        }

        function handleProdDrop(e, targetProdId, targetCatId) {
            e.preventDefault();
            e.stopPropagation();
            e.currentTarget.classList.remove('prod-drag-over');

            const dataStr = e.dataTransfer.getData('text/plain');
            if (!dataStr) return;
            const [type, draggedProdId] = dataStr.split('|');

            if (type !== 'prod' || draggedProdId === targetProdId) return;
            reorderProductWithinSameCat(draggedProdId, targetProdId, targetCatId);
        }

        function reorderProductWithinSameCat(draggedProdId, targetProdId, catId) {
            const draggedProd = state.products.find(p => p.id === draggedProdId);
            const targetProd = state.products.find(p => p.id === targetProdId);

            // Garante que só organiza se ambos pertencerem à mesma lista de fornecedor
            if (!draggedProd || !targetProd) return;
            if (draggedProd.categoryId !== catId || targetProd.categoryId !== catId) return;

            const fromIdx = state.products.findIndex(p => p.id === draggedProdId);
            const toIdx = state.products.findIndex(p => p.id === targetProdId);
            if (fromIdx === -1 || toIdx === -1 || fromIdx === toIdx) return;

            pushStateToUndo();
            const [moved] = state.products.splice(fromIdx, 1);
            const newToIdx = state.products.findIndex(p => p.id === targetProdId);
            state.products.splice(fromIdx < toIdx ? newToIdx + 1 : newToIdx, 0, moved);

            saveData();
            renderEstoque();
        }

        // Suporte Touch (Telemóvel) para arrastar produtos para cima e para baixo na mesma lista
        function startProdTouchDrag(e, prodId, catId) {
            touchDragState = { active: true, prodId, catId };
            const card = document.querySelector(`[data-prod-id="${prodId}"]`);
            if (card) card.classList.add('dragging');
        }

        function moveProdTouchDrag(e) {
            if (!touchDragState.active) return;
            e.preventDefault();
            const touch = e.touches[0];
            document.querySelectorAll('.prod-card-item').forEach(el => el.classList.remove('prod-drag-over'));
            const elUnder = document.elementFromPoint(touch.clientX, touch.clientY);
            const targetCard = elUnder ? elUnder.closest('.prod-card-item') : null;
            if (targetCard && targetCard.dataset.catId === touchDragState.catId && targetCard.dataset.prodId !== touchDragState.prodId) {
                targetCard.classList.add('prod-drag-over');
            }
        }

        function endProdTouchDrag(e) {
            if (!touchDragState.active) return;
            const touch = e.changedTouches[0];
            const elUnder = document.elementFromPoint(touch.clientX, touch.clientY);
            const targetCard = elUnder ? elUnder.closest('.prod-card-item') : null;

            document.querySelectorAll('.prod-card-item').forEach(el => {
                el.classList.remove('dragging', 'prod-drag-over');
            });

            if (targetCard && targetCard.dataset.catId === touchDragState.catId && targetCard.dataset.prodId !== touchDragState.prodId) {
                reorderProductWithinSameCat(touchDragState.prodId, targetCard.dataset.prodId, touchDragState.catId);
            }
            touchDragState = { active: false, prodId: null, catId: null };
        }

        // --- ADIÇÃO POR COMANDO DE VOZ (MICROFONE) ---
        function startVoiceAdd(catId) {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!SpeechRecognition) {
                showModal("Voz Indisponível", "<p class='text-xs text-zinc-600'>O seu navegador atual não suporta reconhecimento de voz nativo. Use o Chrome ou Safari atualizado.</p>", "OK", "bg-zinc-950", () => {});
                return;
            }

            const micBtn = document.getElementById(`mic-btn-${catId}`);
            const input = document.getElementById(`cat-input-${catId}`);
            const recognition = new SpeechRecognition();
            recognition.lang = 'pt-PT';
            recognition.interimResults = false;
            recognition.maxAlternatives = 1;

            if (micBtn) micBtn.classList.add('mic-listening');

            recognition.onresult = (event) => {
                const spoken = event.results[0][0].transcript.replace(/\.$/, '').trim();
                if (input) {
                    input.value = spoken;
                    input.focus();
                    handleCatQuickInput(catId, spoken);
                }
            };

            recognition.onerror = () => { if (micBtn) micBtn.classList.remove('mic-listening'); };
            recognition.onend = () => { if (micBtn) micBtn.classList.remove('mic-listening'); };
            recognition.start();
        }

        // --- ADIÇÃO POR DIGITAÇÃO INTELIGENTE DENTRO DO FORNECEDOR ---
        function handleCatQuickInput(catId, rawValue) {
            const box = document.getElementById(`cat-sugg-${catId}`);
            if (!box) return;

            const trimmed = rawValue.trim();
            if (!trimmed) {
                box.classList.add('hidden');
                box.innerHTML = '';
                return;
            }

            const matches = findSimilarMasterItems(trimmed).slice(0, 6);
            const exactMatch = state.masterData.find(m => normalizeText(m.name) === normalizeText(trimmed));

            let html = '';
            if (matches.length > 0) {
                matches.forEach(m => {
                    const alreadyInThisCat = state.products.some(p => p.categoryId === catId && normalizeText(p.name) === normalizeText(m.name));
                    html += `
                        <button type="button" onclick="selectMasterSuggestionForCat('${catId}', '${m.id}')" class="w-full text-left px-3 py-2 text-xs hover:bg-emerald-50 flex items-center justify-between border-b border-zinc-100 last:border-0 transition">
                            <div>
                                <span class="font-bold text-zinc-900">${m.name}</span>
                                <span class="text-[10px] text-zinc-400 ml-1.5 font-semibold">(${m.group})</span>
                            </div>
                            ${alreadyInThisCat 
                                ? `<span class="text-[10px] font-extrabold text-amber-600 bg-amber-50 px-2 py-0.5 rounded-full">Já na lista</span>` 
                                : `<span class="text-[10px] font-extrabold text-emerald-600 bg-emerald-50 px-2 py-0.5 rounded-full">+ Puxar</span>`
                            }
                        </button>
                    `;
                });
            }

            if (!exactMatch) {
                html += `
                    <button type="button" onclick="submitCatQuickAdd('${catId}')" class="w-full text-left px-3 py-2.5 text-xs bg-zinc-950 text-white hover:bg-zinc-800 flex items-center justify-between transition">
                        <span class="truncate pr-2"><i class="fa-solid fa-plus text-emerald-400 mr-1.5"></i>Cadastrar <b>"${trimmed}"</b> no Catálogo...</span>
                        <span class="text-[10px] bg-emerald-500 text-zinc-950 font-extrabold px-2 py-0.5 rounded-full shrink-0">Novo</span>
                    </button>
                `;
            }

            box.innerHTML = html;
            box.classList.remove('hidden');
        }

        function selectMasterSuggestionForCat(catId, masterId) {
            const masterItem = state.masterData.find(m => m.id === masterId);
            if (!masterItem) return;
            allocateExistingMasterToCat(catId, masterItem);
        }

        function allocateExistingMasterToCat(catId, masterItem) {
            const existingInCat = state.products.find(p => p.categoryId === catId && normalizeText(p.name) === normalizeText(masterItem.name));
            pushStateToUndo();
            if (!existingInCat) {
                state.products.push({
                    id: 'p' + Date.now(),
                    categoryId: catId,
                    name: masterItem.name,
                    qty: 0,
                    received: 0,
                    type: getRememberedMeasure(masterItem.name),
                    urgent: false,
                    pending: false,
                    selected: false,
                    checked: false
                });
            }
            const input = document.getElementById(`cat-input-${catId}`);
            if (input) input.value = '';
            const sugg = document.getElementById(`cat-sugg-${catId}`);
            if (sugg) sugg.classList.add('hidden');
            saveData();
            renderEstoque();
        }

        function submitCatQuickAdd(catId) {
            const input = document.getElementById(`cat-input-${catId}`);
            if (!input) return;
            const rawVal = input.value.trim();
            if (!rawVal) return;

            const normVal = normalizeText(rawVal);
            const exactMaster = state.masterData.find(m => normalizeText(m.name) === normVal);
            if (exactMaster) {
                allocateExistingMasterToCat(catId, exactMaster);
                return;
            }

            openMandatoryMasterRegistrationModal(catId, rawVal);
        }

        function openMandatoryMasterRegistrationModal(catId, typedProductName) {
            const supplier = state.categories.find(c => c.id === catId);
            const supplierName = supplier ? supplier.name : 'Fornecedor';
            const defaultGroups = SEED_MASTER.map(g => g.group);
            const currentGroups = [...new Set([...defaultGroups, ...state.masterData.map(m => m.group)])];

            let opts = `<option value="" disabled selected>Selecione uma categoria do catálogo...</option>`;
            opts += currentGroups.map(g => `<option value="${g}">${g}</option>`).join('');
            opts += `<option value="NOVO_GRUPO_OBRIGATORIO">+ Criar Nova Categoria no Catálogo</option>`;

            const similarItems = findSimilarMasterItems(typedProductName).slice(0, 3);
            let similarHtml = '';
            if (similarItems.length > 0) {
                similarHtml = `
                    <div class="bg-amber-50 border border-amber-200 p-2.5 rounded-xl">
                        <p class="text-[11px] font-extrabold text-amber-900 mb-1.5"><i class="fa-solid fa-magnifying-glass mr-1"></i>Itens semelhantes já no catálogo (toque para usar):</p>
                        <div class="flex flex-wrap gap-1.5">
                            ${similarItems.map(sim => `
                                <button type="button" onclick="closeModal(); selectMasterSuggestionForCat('${catId}', '${sim.id}')" class="text-xs bg-white border border-amber-300 text-amber-950 px-2.5 py-1 rounded-full font-bold hover:bg-amber-100 transition">
                                    ${sim.name} <span class="text-[10px] text-amber-700">(${sim.group})</span>
                                </button>
                            `).join('')}
                        </div>
                    </div>
                `;
            }

            const bodyHtml = `
                <div class="space-y-3">
                    <div class="bg-rose-50 border border-rose-200 p-3 rounded-xl text-rose-900 text-xs leading-relaxed">
                        <i class="fa-solid fa-triangle-exclamation text-rose-600 mr-1"></i>
                        O produto <b>"${typedProductName}"</b> ainda não existe no Banco de Dados (Catálogo Master). Para adicioná-lo ao fornecedor <b>${supplierName}</b>, escolha obrigatoriamente a categoria dele abaixo:
                    </div>

                    ${similarHtml}

                    <div>
                        <label class="font-bold text-[11px] uppercase text-zinc-500 block mb-1">Nome do Produto:</label>
                        <input type="text" id="obrig-prod-name" value="${typedProductName.replace(/"/g, '&quot;')}" class="border border-zinc-300 p-2.5 rounded-xl w-full font-bold text-zinc-900 outline-none focus:border-zinc-900">
                    </div>

                    <div>
                        <label class="font-bold text-[11px] uppercase text-zinc-500 block mb-1">Categoria no Catálogo Base (Obrigatório):</label>
                        <select id="obrig-prod-group" onchange="document.getElementById('obrig-new-group').classList.toggle('hidden', this.value !== 'NOVO_GRUPO_OBRIGATORIO'); document.getElementById('obrig-error').classList.add('hidden');" class="border border-zinc-300 p-2.5 rounded-xl w-full font-bold text-zinc-900 outline-none focus:border-zinc-900">
                            ${opts}
                        </select>
                    </div>

                    <input type="text" id="obrig-new-group" class="hidden border border-emerald-400 p-2.5 rounded-xl w-full bg-emerald-50 font-semibold text-zinc-900 outline-none" placeholder="Digite o nome da nova categoria...">
                    <p id="obrig-error" class="hidden text-xs font-bold text-rose-600"><i class="fa-solid fa-circle-exclamation mr-1"></i>Selecione ou crie uma categoria para continuar.</p>
                </div>
            `;

            showModal("Produto Não Cadastrado", bodyHtml, "Cadastrar e Adicionar", "bg-emerald-600 hover:bg-emerald-700", () => {
                const finalName = document.getElementById('obrig-prod-name').value.trim();
                let selectedGroup = document.getElementById('obrig-prod-group').value;
                if (selectedGroup === 'NOVO_GRUPO_OBRIGATORIO') {
                    selectedGroup = document.getElementById('obrig-new-group').value.trim();
                }

                if (!finalName || !selectedGroup) {
                    const err = document.getElementById('obrig-error');
                    if (err) err.classList.remove('hidden');
                    return false;
                }

                pushStateToUndo();

                let masterObj = state.masterData.find(m => normalizeText(m.name) === normalizeText(finalName));
                if (!masterObj) {
                    masterObj = { id: 'm' + Date.now(), group: selectedGroup, name: finalName };
                    state.masterData.push(masterObj);
                }

                const existsInSupplier = state.products.some(p => p.categoryId === catId && normalizeText(p.name) === normalizeText(masterObj.name));
                if (!existsInSupplier) {
                    state.products.push({
                        id: 'p' + (Date.now() + 1),
                        categoryId: catId,
                        name: masterObj.name,
                        qty: 0,
                        received: 0,
                        type: getRememberedMeasure(masterObj.name),
                        urgent: false,
                        pending: false,
                        selected: false,
                        checked: false
                    });
                }

                saveData();
                renderEstoque();
            });
        }

        document.addEventListener('click', (e) => {
            if (!e.target.closest('.cat-quick-add-wrapper')) {
                document.querySelectorAll('.cat-sugg-box').forEach(el => el.classList.add('hidden'));
            }
            if (!e.target.closest('.note-mention-wrapper')) {
                const mBox = document.getElementById('note-mention-box');
                if (mBox) mBox.classList.add('hidden');
            }
        });

        // --- DIGITAÇÃO DIRETA NA QUANTIDADE ---
        function openDirectQtyModal(prodId, mode) {
            const prod = state.products.find(p => p.id === prodId);
            if (!prod) return;
            const currentVal = mode === 'lista' ? prod.received : prod.qty;
            const labelTitle = mode === 'lista' ? `Quantidade Recebida (${prod.name})` : `Quantidade do Pedido (${prod.name})`;

            const bodyHtml = `
                <div class="space-y-3">
                    <p class="text-xs text-zinc-500">Digite o valor exato para <b>${prod.name}</b> (${prod.type}):</p>
                    <input type="number" id="direct-qty-input" min="0" value="${currentVal}" class="w-full border border-zinc-300 rounded-xl p-3 text-center text-xl font-extrabold text-zinc-900 outline-none focus:border-zinc-950">
                    <div class="flex gap-1.5 justify-center pt-1">
                        ${[5, 10, 15, 20, 30].map(n => `<button type="button" onclick="document.getElementById('direct-qty-input').value=${n}" class="px-2.5 py-1 bg-zinc-100 hover:bg-zinc-200 rounded-lg text-xs font-bold text-zinc-700">${n}</button>`).join('')}
                    </div>
                </div>
            `;

            showModal(labelTitle, bodyHtml, "Aplicar", "bg-zinc-950 hover:bg-zinc-800", () => {
                const val = parseInt(document.getElementById('direct-qty-input').value, 10);
                if (isNaN(val) || val < 0) return false;
                pushStateToUndo();
                if (mode === 'lista') {
                    prod.received = val;
                } else {
                    prod.qty = val;
                    prod.received = val;
                    if (val === 0) { prod.urgent = false; prod.pending = false; prod.checked = false; }
                }
                saveData();
                if (mode === 'lista') renderLista(); else renderEstoque();
            });

            setTimeout(() => {
                const inp = document.getElementById('direct-qty-input');
                if (inp) { inp.focus(); inp.select(); }
            }, 50);
        }

        // --- MODELOS DE PEDIDOS PADRÃO (FAVORITOS) ---
        function openTemplatesModal() {
            const activeItems = state.products.filter(p => p.qty > 0 && !p.pending);
            const templates = state.templates || [];

            let listHtml = '';
            if (templates.length === 0) {
                listHtml = `<div class="p-4 text-center text-xs text-zinc-400 border border-dashed border-zinc-200 rounded-xl">Nenhum modelo salvo ainda. Monte uma lista e salve abaixo!</div>`;
            } else {
                listHtml = `<div class="space-y-2 max-h-48 overflow-y-auto pr-1">` + templates.map(t => `
                    <div class="p-2.5 bg-zinc-50 border border-zinc-200 rounded-xl flex items-center justify-between gap-2">
                        <div class="min-w-0">
                            <div class="font-extrabold text-xs text-zinc-900 truncate">${t.name}</div>
                            <div class="text-[10px] text-zinc-500 font-semibold">${t.items.length} produtos memorizados</div>
                        </div>
                        <div class="flex items-center gap-1 shrink-0">
                            <button type="button" onclick="loadOrderTemplate('${t.id}')" class="bg-emerald-500 text-zinc-950 px-2.5 py-1 rounded-lg text-[11px] font-extrabold hover:bg-emerald-400">Carregar</button>
                            <button type="button" onclick="deleteOrderTemplate('${t.id}')" class="text-zinc-400 hover:text-rose-600 px-1.5 py-1"><i class="fa-solid fa-trash text-xs"></i></button>
                        </div>
                    </div>
                `).join('') + `</div>`;
            }

            const bodyHtml = `
                <div class="space-y-4">
                    <div>
                        <label class="text-[11px] font-extrabold uppercase text-zinc-500 block mb-1.5">Modelos Salvos:</label>
                        ${listHtml}
                    </div>
                    <div class="border-t border-zinc-200 pt-3">
                        <label class="text-[11px] font-extrabold uppercase text-zinc-500 block mb-1">Salvar Lista Ativa Atual (${activeItems.length} itens):</label>
                        <div class="flex gap-1.5">
                            <input type="text" id="new-template-name" placeholder="Ex: Pedido Segunda-feira..." class="flex-1 border border-zinc-300 rounded-xl px-3 py-2 text-xs font-bold outline-none focus:border-zinc-900">
                            <button type="button" onclick="saveCurrentOrderAsTemplate()" class="bg-zinc-950 text-white px-3 py-2 rounded-xl text-xs font-extrabold hover:bg-zinc-800 shrink-0">Salvar</button>
                        </div>
                        <p id="tpl-msg" class="text-[11px] font-bold text-rose-600 mt-1 hidden"></p>
                    </div>
                </div>
            `;

            showModal("⭐ Pedidos Padrão (Modelos)", bodyHtml, "Fechar", "bg-zinc-800", () => {});
        }

        function saveCurrentOrderAsTemplate() {
            const nameInput = document.getElementById('new-template-name');
            const msg = document.getElementById('tpl-msg');
            const name = nameInput ? nameInput.value.trim() : '';
            const activeItems = state.products.filter(p => p.qty > 0 && !p.pending);

            if (!name) {
                if (msg) { msg.innerText = "Digite um nome para o modelo."; msg.classList.remove('hidden'); }
                return;
            }
            if (activeItems.length === 0) {
                if (msg) { msg.innerText = "Adicione quantidades (> 0) na lista antes de salvar o modelo."; msg.classList.remove('hidden'); }
                return;
            }

            pushStateToUndo();
            if (!state.templates) state.templates = [];
            state.templates.push({
                id: 'tpl_' + Date.now(),
                name,
                items: activeItems.map(p => ({
                    categoryId: p.categoryId,
                    name: p.name,
                    qty: p.qty,
                    type: p.type,
                    urgent: p.urgent
                }))
            });
            saveData();
            openTemplatesModal();
        }

        function loadOrderTemplate(tplId) {
            const tpl = (state.templates || []).find(t => t.id === tplId);
            if (!tpl) return;
            pushStateToUndo();

            tpl.items.forEach(tItem => {
                const catExists = state.categories.some(c => c.id === tItem.categoryId);
                if (!catExists) return;
                let prod = state.products.find(p => p.categoryId === tItem.categoryId && normalizeText(p.name) === normalizeText(tItem.name));
                if (prod) {
                    prod.qty = tItem.qty;
                    prod.received = tItem.qty;
                    prod.type = tItem.type || getRememberedMeasure(prod.name);
                    prod.urgent = !!tItem.urgent;
                    prod.pending = false;
                    prod.checked = false;
                } else {
                    state.products.push({
                        id: 'p' + Date.now() + Math.random().toString(36).slice(2, 6),
                        categoryId: tItem.categoryId,
                        name: tItem.name,
                        qty: tItem.qty,
                        received: tItem.qty,
                        type: tItem.type || getRememberedMeasure(tItem.name),
                        urgent: !!tItem.urgent,
                        pending: false,
                        selected: false,
                        checked: false
                    });
                }
            });

            saveData();
            closeModal();
            refreshCurrentTabView();
        }

        function deleteOrderTemplate(tplId) {
            pushStateToUndo();
            state.templates = (state.templates || []).filter(t => t.id !== tplId);
            saveData();
            openTemplatesModal();
        }

        function updateBulkBar() {
            const selectedCount = state.products.filter(p => p.selected).length;
            const bar = document.getElementById('global-bulk-bar');
            if (bar) {
                if (selectedCount > 0) {
                    bar.classList.remove('hidden');
                    document.getElementById('bulk-count-text').innerText = selectedCount;
                } else {
                    bar.classList.add('hidden');
                }
            }
        }

        function clearBulkSelection() {
            state.products.forEach(p => p.selected = false);
            saveData(); renderEstoque(); updateBulkBar();
        }

        function renderEstoque() {
            const catContainer = document.getElementById('categorias-container');
            const sortedCats = state.categories.sort((a, b) => a.order - b.order);
            const normGlobalSearch = normalizeText(uiState.searchQuery);

            let filterChipsHtml = `

                        <i class="fa-solid fa-plus text-emerald-400 mr-1"></i> Categoria
                    </button>
                </div>
                <div class="flex items-center gap-1.5 overflow-x-auto no-scrollbar pb-3">
                    <button onclick="setCatFilter('ALL')" class="shrink-0 px-3 py-1.5 rounded-full text-xs font-bold transition ${uiState.activeCatFilter === 'ALL' ? 'bg-zinc-950 text-white' : 'bg-white text-zinc-600 border border-zinc-200'}">Todos</button>

            sortedCats.forEach(c => {

            });
            filterChipsHtml += `</div>`;

            let html = filterChipsHtml;
            const catsToDisplay = uiState.activeCatFilter === 'ALL' ? sortedCats : sortedCats.filter(c => c.id === uiState.activeCatFilter);

            catsToDisplay.forEach((cat) => {
                const realIndex = sortedCats.findIndex(c => c.id === cat.id);
                let catProducts = state.products.filter(p => p.categoryId === cat.id);
                if (normGlobalSearch) {
                    catProducts = catProducts.filter(p => normalizeText(p.name).includes(normGlobalSearch));
                }

                // Mantém o estado fechado/aberto exatamente como o utilizador deixou salvo
                const isCollapsed = !!(state.collapsedCats && state.collapsedCats[cat.id]) && !normGlobalSearch;
                const bgLight = `rgba(${parseInt(cat.color.slice(1, 3), 16)}, ${parseInt(cat.color.slice(3, 5), 16)}, ${parseInt(cat.color.slice(5, 7), 16)}, 0.12)`;
                
                html += `
                    <div class="cat-container bg-white rounded-2xl shadow-2xs border border-zinc-200/90 mb-3 overflow-visible transition-all duration-150" 
                         ondragover="handleDragOver(event)" ondragleave="handleDragLeave(event)" ondrop="handleDrop(event, '${cat.id}')">
                        <div class="bg-white px-3.5 py-2.5 flex justify-between items-center border-b border-zinc-100 cursor-move group ${isCollapsed ? 'rounded-2xl' : 'rounded-t-2xl'}" style="border-left: 5px solid ${cat.color}" draggable="true" ondragstart="handleDragStart(event, 'cat', ${realIndex})" ondragend="handleDragEnd(event)">
                            <div class="flex items-center gap-2 flex-1 cursor-pointer" onclick="toggleCatCollapse('${cat.id}')">
                                <i class="fa-solid fa-grip-vertical text-zinc-300 text-xs"></i>
                                <span class="w-2.5 h-2.5 rounded-full shrink-0" style="background-color:${cat.color}"></span>
                                <h3 class="font-extrabold text-sm text-zinc-900">${cat.name}</h3>
                                <span class="text-[11px] font-bold px-2 py-0.5 rounded-full bg-zinc-100 text-zinc-600">${catProducts.length}</span>
                            </div>
                            <div class="flex items-center gap-1">
                                <button onclick="actionEditCategory('${cat.id}')" class="text-zinc-400 hover:text-zinc-800 w-7 h-7 rounded-lg hover:bg-zinc-100"><i class="fa-solid fa-palette text-xs"></i></button>
                                <button onclick="actionDeleteCategory('${cat.id}')" class="text-zinc-400 hover:text-rose-600 w-7 h-7 rounded-lg hover:bg-rose-50"><i class="fa-solid fa-trash text-xs"></i></button>
                                <button onclick="toggleCatCollapse('${cat.id}')" class="text-zinc-400 hover:text-zinc-800 w-7 h-7 rounded-lg flex items-center justify-center">
                                    <i class="fa-solid fa-chevron-${isCollapsed ? 'down' : 'up'} text-[11px]"></i>
                                </button>
                            </div>
                        </div>

                        <div class="${isCollapsed ? 'hidden' : 'p-2.5 space-y-2'}">
                            <!-- Barra de Adição Escrevendo + Microfone de Voz -->
                            <div class="relative cat-quick-add-wrapper">
                                <div class="flex items-center gap-1.5">
                                    <div class="relative flex-1">
                                        <i class="fa-solid fa-keyboard absolute left-3 top-1/2 -translate-y-1/2 text-zinc-400 text-[11px]"></i>
                                        <input type="text" id="cat-input-${cat.id}"
                                               oninput="handleCatQuickInput('${cat.id}', this.value)"
                                               onkeydown="if(event.key === 'Enter'){ event.preventDefault(); submitCatQuickAdd('${cat.id}'); }"
                                               placeholder="Escrever ou falar item em ${cat.name}..."
                                               autocomplete="off"
                                               class="w-full pl-8 pr-8 py-1.5 bg-zinc-50 border border-zinc-200 rounded-xl text-xs font-semibold text-zinc-900 placeholder-zinc-400 focus:bg-white focus:outline-none focus:border-zinc-900 transition">
                                        <button type="button" id="mic-btn-${cat.id}" onclick="startVoiceAdd('${cat.id}')" title="Falar nome do produto" class="absolute right-1.5 top-1/2 -translate-y-1/2 w-6 h-6 rounded-lg text-zinc-400 hover:text-zinc-900 flex items-center justify-center transition">
                                            <i class="fa-solid fa-microphone text-[11px]"></i>
                                        </button>
                                    </div>
                                    <button type="button" onclick="submitCatQuickAdd('${cat.id}')" class="bg-zinc-950 hover:bg-zinc-800 text-white px-3 py-1.5 rounded-xl text-xs font-extrabold transition shrink-0 flex items-center gap-1">
                                        <i class="fa-solid fa-plus text-emerald-400 text-[10px]"></i> Adicionar
                                    </button>
                                </div>

        function renderMasterData() {
            const container = document.getElementById('master-data-list');
            const grouped = {}; const allGroups = [];
            const normGlobalSearch = normalizeText(uiState.searchQuery);

            state.masterData.forEach(item => {
                if (!allGroups.includes(item.group)) allGroups.push(item.group);
                if (normGlobalSearch && !normalizeText(item.name).includes(normGlobalSearch) && !normalizeText(item.group).includes(normGlobalSearch)) return;
                if (!grouped[item.group]) grouped[item.group] = []; grouped[item.group].push(item);
            });

            let groupChips = `<div class="flex items-center gap-1.5 overflow-x-auto no-scrollbar pb-2 border-b border-zinc-100"><button onclick="setMasterGroupFilter('ALL')" class="shrink-0 px-2.5 py-1 rounded-lg text-[11px] font-extrabold ${uiState.activeMasterGroup === 'ALL' ? 'bg-zinc-950 text-white' : 'bg-zinc-100 text-zinc-600'}">Todos</button>`;
            allGroups.forEach(gName => { groupChips += `<button onclick="setMasterGroupFilter('${gName}')" class="shrink-0 px-2.5 py-1 rounded-lg text-[11px] font-bold ${uiState.activeMasterGroup === gName ? 'bg-zinc-950 text-white' : 'bg-zinc-100 text-zinc-600'}">${gName}</button>`; });
            groupChips += `</div>`;

            let html = groupChips + `<div class="max-h-[62vh] overflow-y-auto pr-0.5 space-y-3 pt-1">`;
            for (const [groupName, items] of Object.entries(grouped)) {
                if (uiState.activeMasterGroup !== 'ALL' && uiState.activeMasterGroup !== groupName) continue;

                // Cada grupo do Catálogo Master aceita drop de itens para mudar de categoria arrastando
                html += `
                    <div class="master-group-container border border-zinc-200/80 rounded-xl bg-zinc-50/50 overflow-hidden transition-all"
                         ondragover="handleMasterGroupDragOver(event)"
                         ondragleave="handleMasterGroupDragLeave(event)"
                         ondrop="handleMasterGroupDrop(event, '${groupName.replace(/'/g, "\\'")}')">
                        <div class="bg-zinc-100/80 px-3 py-1.5 border-b border-zinc-200/60 font-extrabold text-[11px] uppercase tracking-wider text-zinc-600 flex justify-between items-center">
                            <span>${groupName}</span>
                            <span class="text-[10px] text-zinc-400">${items.length}</span>
                        </div>
                        <div class="p-2.5 flex flex-wrap gap-1.5">
                `;
                
                items.forEach(item => {
                    const alloc = getMasterItemAllocation(item.name);
                    let pillStyle = '';
                    
                    if (alloc.isAllocated) {
                        if (alloc.colors.length === 1) {
                            pillStyle = `background-color: ${alloc.colors[0]}; border: none; color: white;`;
                        } else {
                            const step = 100 / alloc.colors.length;
                            let gradParts = [];
                            alloc.colors.forEach((c, i) => { gradParts.push(`${c} ${i * step}%`); gradParts.push(`${c} ${(i + 1) * step}%`); });
                            pillStyle = `background: linear-gradient(90deg, ${gradParts.join(', ')}); border: none; color: white; text-shadow: 0px 1px 2px rgba(0,0,0,0.5);`;
                        }
                    }

                    const pillClasses = alloc.isAllocated ? "flex items-center rounded-full pl-2.5 pr-1 py-1 shadow-2xs text-xs font-bold cursor-grab" : "flex items-center bg-white border border-zinc-300 rounded-full pl-2.5 pr-1 py-1 shadow-2xs text-xs font-semibold text-zinc-800 hover:border-zinc-900 cursor-grab";
                    
                    html += `
                        <div class="${pillClasses}" style="${pillStyle}" draggable="true" ondragstart="handleDragStart(event, 'master', '${item.id}')" ondragend="handleDragEnd(event)">

                            <!-- Segurar em cima do nome abre a edição global do banco de dados -->
                            <span class="mr-1.5 select-none"
                                  title="Segure em cima do nome para renomear em todo o sistema"

                            <button onclick="actionChangeMasterItemGroup('${item.id}')" title="Mudar de categoria no Catálogo Master" class="${alloc.isAllocated ? 'bg-black/20 hover:bg-black/40 text-white' : 'bg-zinc-100 hover:bg-zinc-200 text-zinc-600'} w-5 h-5 rounded-full flex items-center justify-center mr-0.5 transition"><i class="fa-solid fa-folder-open text-[9px]"></i></button>
                            <button onclick="actionMoveFromMasterToCat('${item.id}')" title="Alocar num fornecedor" class="${alloc.isAllocated ? 'bg-black/20 hover:bg-black/40 text-white' : 'bg-zinc-900 hover:bg-emerald-500 text-emerald-400 hover:text-white'} w-5 h-5 rounded-full flex items-center justify-center transition"><i class="fa-solid fa-arrow-up text-[10px]"></i></button>
                            <button onclick="actionDeleteMasterItem('${item.id}')" title="Excluir do catálogo" class="${alloc.isAllocated ? 'ml-0.5 text-white/75 hover:text-white' : 'ml-0.5 text-zinc-400 hover:text-rose-600'} w-5 h-5 rounded-full flex items-center justify-center transition"><i class="fa-solid fa-xmark text-[10px]"></i></button>
                        </div>
                    `;
                });
                html += `</div></div>`;
            }
            html += `</div>`;
            document.getElementById('master-data-list').innerHTML = html;
        }

        function updateQty(id, change, fromView) {
            const prod = state.products.find(p => p.id === id);
            if (!prod) return;

            if (fromView === 'lista') {
                prod.received = Math.max(0, prod.received + change);
            } else {
                prod.qty = Math.max(0, prod.qty + change);
                prod.received = prod.qty; 
                if (prod.qty === 0) { prod.urgent = false; prod.pending = false; prod.checked = false; }
            }
            saveData(); 
            if(fromView === 'estoque') renderEstoque();
            if(fromView === 'lista') renderLista();
        }

        function toggleDeliveryCheck(prodId) {
            const prod = state.products.find(p => p.id === prodId);
            if (!prod) return;
            prod.checked = !prod.checked;
            saveData();
            renderLista();
        }

            const allSelected = state.products.filter(p => p.qty > 0 || p.pending);
            const visibleItems = allSelected.filter(p => !p.pending);

            if (allSelected.length === 0) {
                container.innerHTML = `<div class="text-center p-10 bg-white rounded-2xl border border-zinc-200/80 shadow-2xs text-zinc-400 font-bold"><i class="fa-solid fa-basket-shopping text-2xl mb-2"></i><br>Sua lista está vazia</div>`;

            let html = `
                <div class="grid grid-cols-2 gap-2.5 mb-4 sticky top-0 bg-zinc-100/95 backdrop-blur-md pt-1 pb-2 z-10">

                    <button onclick="actionSendWhatsApp(null)" class="bg-emerald-500 text-zinc-950 py-3 px-4 rounded-xl font-extrabold shadow-sm hover:bg-emerald-400 flex items-center justify-center gap-2 text-xs transition">
                        <i class="fa-brands fa-whatsapp text-base"></i> WhatsApp Geral
                    </button>
                </div>
            `;

            const sortedCats = state.categories.sort((a, b) => a.order - b.order);
            sortedCats.forEach(cat => {
                const catItems = visibleItems.filter(p => p.categoryId === cat.id);
                if (catItems.length === 0) return;

                const checkedCount = catItems.filter(p => p.checked).length;
                const bgLight = `rgba(${parseInt(cat.color.slice(1, 3), 16)}, ${parseInt(cat.color.slice(3, 5), 16)}, ${parseInt(cat.color.slice(5, 7), 16)}, 0.08)`;
                
                html += `
                    <div class="bg-white rounded-2xl shadow-2xs border border-zinc-200/90 mb-3 overflow-hidden" style="border-left: 5px solid ${cat.color}">
                        <div class="px-3.5 py-2.5 border-b border-zinc-100 flex items-center justify-between gap-2" style="background-color: ${bgLight}">
                            <div class="flex items-center gap-2 min-w-0">
                                <span class="w-2.5 h-2.5 rounded-full shrink-0" style="background-color: ${cat.color}"></span>
                                <h3 class="font-extrabold text-zinc-900 text-xs truncate">${cat.name}</h3>
                                <span class="text-[10px] font-bold px-2 py-0.5 rounded-full bg-white border border-zinc-200 text-zinc-600">${checkedCount}/${catItems.length} conf.</span>
                            </div>
                            <div class="flex items-center gap-1.5 shrink-0">
                                <button onclick="actionSendWhatsApp('${cat.id}')" title="Enviar apenas ${cat.name} para WhatsApp" class="bg-emerald-500 hover:bg-emerald-400 text-zinc-950 px-2.5 py-1 rounded-lg text-[10px] font-extrabold flex items-center gap-1 transition shadow-2xs">
                                    <i class="fa-brands fa-whatsapp text-xs"></i> Enviar
                                </button>
                                <button onclick="actionCheckDiscrepancies('${cat.id}')" title="Finalizar entrega apenas de ${cat.name}" class="bg-zinc-950 hover:bg-zinc-800 text-white px-2.5 py-1 rounded-lg text-[10px] font-extrabold flex items-center gap-1 transition shadow-2xs">
                                    <i class="fa-solid fa-check text-emerald-400"></i> Finalizar
                                </button>
                            </div>
                        </div>
                        <ul class="divide-y divide-zinc-100">
                `;

                catItems.forEach(prod => {
                    const isMentioned = isProductMentionedInNotes(prod.name);
                    const mentionBadge = isMentioned ? `<button onclick="openNoteFor('${prod.name}')" class="ml-1.5 text-amber-500 bg-amber-50 border border-amber-200 px-1.5 py-0.5 rounded text-[10px] font-black"><i class="fa-solid fa-at"></i> Nota</button>` : '';

                    html += `
                        <li class="px-3.5 py-2.5 transition-colors ${prod.checked ? 'checked-delivery-row' : (prod.urgent ? 'bg-rose-50/70' : '')}">
                            <div class="flex justify-between items-center gap-2">
                                <div class="flex items-center gap-2.5 flex-1 min-w-0">
                                    <button onclick="toggleDeliveryCheck('${prod.id}')" title="Marcar como conferido na entrega" class="w-6 h-6 rounded-lg border flex items-center justify-center shrink-0 transition ${prod.checked ? 'bg-emerald-500 border-emerald-500 text-zinc-950 font-black' : 'bg-white border-zinc-300 text-transparent hover:border-zinc-500'}">
                                        <i class="fa-solid fa-check text-xs"></i>
                                    </button>
                                    <div class="min-w-0 flex-1">
                                        <div class="flex items-center gap-1">
                                            <span class="font-bold text-sm truncate ${prod.checked ? 'line-through text-zinc-500' : (prod.urgent ? 'text-rose-700' : 'text-zinc-900')}">${prod.name}</span>
                                            ${mentionBadge} ${prod.urgent ? '<span class="text-[9px] uppercase font-extrabold bg-rose-600 text-white px-1.5 py-0.5 rounded ml-1">Urgente</span>' : ''}
                                        </div>
                                        <div class="text-zinc-500 font-semibold text-[10px] mt-0.5">Pedido: <span class="text-zinc-800 font-bold">${prod.qty} ${prod.type}</span> | Recebido:</div>
                                    </div>
                                </div>
                                <div class="flex items-center gap-1 bg-zinc-100 border border-zinc-200 rounded-xl p-0.5">
                                    <button onclick="updateQty('${prod.id}', -1, 'lista')" class="w-8 h-8 rounded-lg bg-white text-zinc-700 hover:bg-zinc-50 font-bold text-sm shadow-2xs">-</button>
                                    <button onclick="openDirectQtyModal('${prod.id}', 'lista')" title="Toque para digitar o recebido" class="min-w-7 px-1 text-center font-extrabold text-[15px] text-zinc-900 hover:text-emerald-600">${prod.received}</button>
                                    <button onclick="updateQty('${prod.id}', 1, 'lista')" class="w-8 h-8 rounded-lg bg-zinc-950 text-white hover:bg-zinc-800 font-bold text-sm shadow-2xs">+</button>
                                </div>
                            </div>

                    `;
                });

            });

            if (pendingItems.length > 0) {
                html += `<div class="mt-6 mb-4 border border-dashed border-amber-400 rounded-2xl bg-amber-50/70 p-3.5"><h3 class="text-amber-900 font-extrabold mb-2.5 text-xs uppercase flex items-center gap-1.5"><i class="fa-solid fa-box-open text-amber-600"></i> Adiados p/ Próxima</h3><div class="space-y-1.5">`;

                    html += `
                        <div class="bg-white border border-amber-200/80 px-3 py-2 rounded-xl flex justify-between items-center shadow-2xs">

                            <button onclick="actionToggleRestore('${prod.id}')" class="text-zinc-950 font-extrabold text-[11px] bg-emerald-400 px-2.5 py-1 rounded-lg hover:bg-emerald-300">Restaurar</button>
